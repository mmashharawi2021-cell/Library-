      - name: V45 touch interaction QA — 393px
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > v45-touch-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const site=process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/';
          const page=await browser.newPage();
          await page.setViewport({width:393,height:852,deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(site,{waitUntil:'networkidle0',timeout:60000});
          await page.waitForFunction(()=>document.querySelectorAll('#cards .ui-demo').length===81);

          const bring=sel=>page.$eval(sel,x=>x.scrollIntoView({block:'center',inline:'center'}));

          await bring('.demo-hover-card');
          await page.tap('.demo-hover-card .hover-trigger');
          assert(await page.$eval('.demo-hover-card .hovercard',x=>x.classList.contains('is-touch-open')),'Hover card tap fallback did not open');

          await bring('.demo-popover-dropdown-tooltip');
          await page.tap('.demo-popover-dropdown-tooltip .info');
          assert(await page.$eval('.demo-popover-dropdown-tooltip .overlay-kinds',x=>x.dataset.open==='tooltip'),'Tooltip tap fallback did not open');

          await bring('.demo-marquee');
          await page.tap('.demo-marquee .marquee');
          assert(await page.$eval('.demo-marquee .marquee',x=>x.classList.contains('is-paused')),'Marquee did not pause on tap');

          await bring('.demo-pointer');
          await page.tap('.demo-pointer .cursors>span:first-child');
          assert(await page.$eval('.demo-pointer .cursors>span:first-child',x=>x.classList.contains('is-selected')||x.classList.contains('is-selected')),'Pointer specimen did not select on tap');

          await bring('.demo-lightbox');
          await page.tap('.demo-lightbox .thumb');
          assert(await page.$eval('.demo-lightbox .lightbox',x=>x.classList.contains('is-open')),'Lightbox did not open on tap');
          await page.tap('.demo-lightbox .photo button');
          assert(await page.$eval('.demo-lightbox .lightbox',x=>!x.classList.contains('is-open')),'Lightbox did not close on tap');

          await bring('.demo-slider-macos');
          const sliderTouch=await page.$eval('.demo-slider-macos .slider-native',async el=>{
            const r=el.getBoundingClientRect(),before=Number(el.value),sy=r.top+r.height/2,sx=r.left+r.width*.28,ex=r.left+r.width*.82;
            const mk=(x)=>new Touch({identifier:41,target:el,clientX:x,clientY:sy,pageX:x,pageY:sy,screenX:x,screenY:sy});
            el.dispatchEvent(new TouchEvent('touchstart',{bubbles:true,cancelable:true,touches:[mk(sx)],targetTouches:[mk(sx)],changedTouches:[mk(sx)]}));
            for(let i=1;i<=6;i++){const x=sx+(ex-sx)*i/6;el.dispatchEvent(new TouchEvent('touchmove',{bubbles:true,cancelable:true,touches:[mk(x)],targetTouches:[mk(x)],changedTouches:[mk(x)]}))}
            el.dispatchEvent(new TouchEvent('touchend',{bubbles:true,cancelable:true,touches:[],targetTouches:[],changedTouches:[mk(ex)]}));
            return {before,after:Number(el.value)};
          });
          assert(sliderTouch.after!==sliderTouch.before,'Slider TouchEvent drag did not change value');

          await bring('.demo-context-menu');
          await page.$eval('.demo-context-menu .fileitem',async item=>{
            const r=item.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,id=91;
            item.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:y}));
            await new Promise(r=>setTimeout(r,620));
            item.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:y}));
          });
          assert(await page.$eval('.demo-context-menu .fileitem',x=>x.classList.contains('is-touch-open')&&x.getAttribute('aria-expanded')==='true'),'Context menu long press did not open');

          await bring('.demo-drag-drop');
          const dragResult=await page.$eval('.demo-drag-drop',async demo=>{
            const card=demo.querySelector('[data-dropzone]:first-child [data-drag-card]'),target=demo.querySelector('[data-dropzone]:last-child');
            const a=card.getBoundingClientRect(),b=target.getBoundingClientRect(),id=92;
            const sx=a.left+a.width/2,sy=a.top+a.height/2,ex=b.left+b.width/2,ey=b.top+b.height*.75;
            card.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:sx,clientY:sy}));
            for(let i=1;i<=6;i++){
              const x=sx+(ex-sx)*i/6,y=sy+(ey-sy)*i/6;
              card.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:y}));
              await new Promise(r=>setTimeout(r,20));
            }
            card.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:ex,clientY:ey}));
            return target.contains(card);
          });
          assert(dragResult,'Finger drag & drop did not move the Kanban card');

          await bring('.demo-parallax-scrolling');
          const par=await page.$eval('.demo-parallax-scrolling .parallax-ref',async el=>{
            const r=el.getBoundingClientRect(),id=93,x=r.left+r.width/2,sy=r.top+r.height*.72,ey=r.top+r.height*.28;
            const before=Number(el.dataset.offset||0);
            el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:sy}));
            el.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:ey}));
            el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:ey}));
            return {before,after:Number(el.dataset.offset||0)};
          });
          assert(par.after!==par.before,'Parallax did not react to vertical swipe');

          assert(errors.length===0,'V45 touch page errors: '+errors.join(' | '));
          await page.screenshot({path:'qa-screenshots/v45-touch-interactions-393.png',fullPage:true});
          console.log('LIVE V45 TOUCH QA PASSED — tap, long-press, native touch slider, finger drag/drop and parallax swipe validated.');
          await browser.close();
          JS
          node v45-touch-qa.mjs

      - name: V45 semantic interaction QA — 81 contracts
        env:
