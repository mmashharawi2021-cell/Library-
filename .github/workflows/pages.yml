name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check app.js

      - name: Build
        run: node scripts/build-static.mjs

      - name: Validate catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('data.js','utf8');
          const first=src.indexOf('{');
          const last=src.lastIndexOf('}');
          if(first<0||last<first) throw new Error('Could not locate UI_AR_DATA JSON payload');
          const d=JSON.parse(src.slice(first,last+1));
          const app=fs.readFileSync('app.js','utf8');
          const demoStart=app.indexOf('function demo(');
          const demoEnd=app.indexOf('function card(',demoStart);
          if(demoStart<0||demoEnd<demoStart) throw new Error('Could not isolate demo()');
          const demoBlock=app.slice(demoStart,demoEnd);
          const r={
            entries:d.entries.length,
            web:d.entries.filter(e=>e.category==='web').length,
            macos:d.entries.filter(e=>e.category==='macos').length,
            styles:d.styles.length,
            comparisons:d.comparisons.length,
            translations:d.translations.length,
            glossary:Object.keys(d.glossary||{}).length,
            sitemapUrls:(fs.readFileSync('dist/sitemap.xml','utf8').match(/<loc>/g)||[]).length,
            demoCases:demoBlock.split("case '").length-1
          };
          const expected={entries:81,web:49,macos:32,styles:14,comparisons:18,translations:63,glossary:38,sitemapUrls:125,demoCases:81};
          for(const [k,v] of Object.entries(expected)){
            if(r[k]!==v) throw new Error(`${k}: expected ${v}, got ${r[k]}`);
          }
          const sitemap=fs.readFileSync('dist/sitemap.xml','utf8');
          if(!sitemap.includes('/web/')||!sitemap.includes('/macos/')) throw new Error('Platform indexes missing from sitemap');
          if(sitemap.includes('/element/')) throw new Error('Legacy /element/ URLs must not appear in sitemap');
          if(sitemap.includes('/saved/')) throw new Error('Saved must not appear in sitemap');
          for(const e of d.entries){
            const direct=`dist/${e.category}/${e.slug}/index.html`;
            const legacy=`dist/element/${e.slug}/index.html`;
            if(!fs.existsSync(direct)) throw new Error(`Missing static direct route: ${direct}`);
            if(!fs.existsSync(legacy)) throw new Error(`Missing legacy redirect: ${legacy}`);
            const redirectHtml=fs.readFileSync(legacy,'utf8');
            if(!redirectHtml.includes(`/${e.category}/${e.slug}/`)) throw new Error(`Legacy redirect target mismatch for ${e.slug}`);
          }
          console.log('Catalog validation passed', r);
          NODE

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Install live QA browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Live QA — all 81 cards
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > card-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';

          const browser=await puppeteer.launch({
            headless:true,
            executablePath:'/usr/bin/google-chrome',
            args:['--no-sandbox']
          });
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};
          const site=process.env.SITE || 'https://mmashharawi2021-cell.github.io/Library-/';

          for(const width of [393,1440]){
            const page=await browser.newPage();
            await page.setViewport({width,height:1000,deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(site+'?cardqa=16',{waitUntil:'networkidle0',timeout:60000});
            await page.waitForSelector('#cards > .entry-card');

            const result=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('#cards > .entry-card')];
              const previews=cards.map(c=>c.querySelector(':scope > .entry-preview'));
              const demos=previews.map(p=>p?.querySelector('.ui-demo'));
              const missing=cards.map((c,i)=>{
                const p=previews[i],d=demos[i];
                return (p&&d)?null:{i,href:c.getAttribute('href')};
              }).filter(Boolean);
              const demoClasses=demos.filter(Boolean).map(el=>[...el.classList].find(c=>c.startsWith('demo-'))).filter(Boolean);
              const empty=previews.map((p,i)=>p && p.innerHTML.trim()?null:i).filter(x=>x!==null);
              return {
                cards:cards.length,
                previews:previews.filter(Boolean).length,
                demos:demos.filter(Boolean).length,
                uniqueDemoClasses:new Set(demoClasses).size,
                uniqueMarkup:new Set(previews.filter(Boolean).map(p=>p.innerHTML)).size,
                fallbacks:document.querySelectorAll('#cards > .entry-card .fallback-demo').length,
                missing,
                empty,
                pageOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });

            assert(result.cards===81,`Expected 81 cards, got ${result.cards} at ${width}px`);
            assert(result.previews===81,`Missing card previews: ${JSON.stringify(result.missing)}`);
            assert(result.demos===81,`Missing demo roots: ${JSON.stringify(result.missing)}`);
            assert(result.uniqueDemoClasses===81,`Expected 81 unique demo classes, got ${result.uniqueDemoClasses}`);
            assert(result.uniqueMarkup===81,`Expected 81 unique preview markups, got ${result.uniqueMarkup}`);
            assert(result.fallbacks===0,`Fallback demos found: ${result.fallbacks}`);
            assert(result.empty.length===0,`Empty previews: ${result.empty.join(',')}`);
            assert(result.pageOverflow<=2,`Horizontal page overflow: ${result.pageOverflow}px at ${width}px`);
            assert(errors.length===0,`Page errors at ${width}px: ${errors.join(' | ')}`);

            if(width===393){
              await page.click('[data-cat="web"]');
              await page.waitForFunction(()=>document.querySelectorAll('#cards > .entry-card').length===49);
              const webCount=await page.$$eval('#cards > .entry-card',els=>els.length);
              assert(webCount===49,`Web filter expected 49, got ${webCount}`);

              await page.click('[data-cat="macos"]');
              await page.waitForFunction(()=>document.querySelectorAll('#cards > .entry-card').length===32);
              const macCount=await page.$$eval('#cards > .entry-card',els=>els.length);
              assert(macCount===32,`macOS filter expected 32, got ${macCount}`);
            }

            await page.close();
          }

          console.log('LIVE CARD QA PASSED — 81 unique cards, no fallbacks, filters correct.');

          const detailPage=await browser.newPage();
          await detailPage.setViewport({width:393,height:1000,deviceScaleFactor:1});
          const detailErrors=[];
          detailPage.on('pageerror',e=>detailErrors.push(String(e)));
          await detailPage.goto(site+'?detailqa=17',{waitUntil:'networkidle0',timeout:60000});
          const slugs=await detailPage.evaluate(()=>window.UI_AR_DATA.entries.map(e=>e.slug));
          for(const slug of slugs){
            await detailPage.evaluate(s=>{location.hash='#/element/'+s},slug);
            await detailPage.waitForFunction(s=>{
              const d=document.querySelector('.detail');
              return location.hash==='#/element/'+s && !!d && !!d.querySelector('.specimen .ui-demo') && !!d.querySelector('.anatomy .part') && !!d.querySelector('.prompt-agent') && !!d.querySelector('.prompt-debug') && !!d.querySelector('.code-table') && !!d.querySelector('.related a');
            },{timeout:10000},slug);
            const check=await detailPage.evaluate(()=>({
              h1:document.querySelector('.detail h1')?.textContent?.trim(),
              actions:document.querySelectorAll('.detail-actions button').length,
              parts:document.querySelectorAll('.anatomy .part').length,
              prompts:document.querySelectorAll('.prompt').length,
              codeRows:document.querySelectorAll('.code-table tr').length,
              related:document.querySelectorAll('.related a').length,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            assert(!!check.h1,`Missing detail title for ${slug}`);
            assert(check.actions===3,`Expected 3 detail actions for ${slug}, got ${check.actions}`);
            assert(check.parts>0,`Missing anatomy for ${slug}`);
            assert(check.prompts===2,`Expected 2 prompts for ${slug}, got ${check.prompts}`);
            assert(check.codeRows>0,`Missing code rows for ${slug}`);
            assert(check.related>0,`Missing related links for ${slug}`);
            assert(check.overflow<=2,`Detail horizontal overflow ${check.overflow}px for ${slug}`);
          }
          assert(detailErrors.length===0,`Detail page errors: ${detailErrors.join(' | ')}`);
          await detailPage.close();
          console.log('LIVE DETAIL QA PASSED — all 81 element pages rendered with complete structure.');

          for(const width of [393,1440]){
            const stylePage=await browser.newPage();
            await stylePage.setViewport({width,height:1000,deviceScaleFactor:1});
            const styleErrors=[];
            stylePage.on('pageerror',e=>styleErrors.push(String(e)));
            await stylePage.goto(site+'?styleqa=18#/styles',{waitUntil:'networkidle0',timeout:60000});
            await stylePage.waitForSelector('.atlas-grid > .atlas-card');
            const atlas=await stylePage.evaluate(()=>({
              cards:document.querySelectorAll('.atlas-grid > .atlas-card').length,
              visuals:document.querySelectorAll('.atlas-grid .style-visual').length,
              uniqueMarkup:new Set([...document.querySelectorAll('.atlas-preview')].map(x=>x.innerHTML)).size,
              empty:[...document.querySelectorAll('.atlas-preview')].filter(x=>!x.innerHTML.trim()).length,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            assert(atlas.cards===14,`Styles atlas expected 14 cards, got ${atlas.cards} at ${width}px`);
            assert(atlas.visuals===14,`Styles atlas expected 14 visuals, got ${atlas.visuals}`);
            assert(atlas.uniqueMarkup===14,`Expected 14 unique style specimens, got ${atlas.uniqueMarkup}`);
            assert(atlas.empty===0,`Empty style specimens: ${atlas.empty}`);
            assert(atlas.overflow<=2,`Styles atlas horizontal overflow ${atlas.overflow}px at ${width}px`);

            if(width===393){
              await stylePage.click('[data-style-slug="neumorphism"]');
              await stylePage.waitForFunction(()=>document.querySelectorAll('.atlas-grid > .atlas-card').length===1);
              const forced=await stylePage.$$eval('.atlas-grid > .atlas-card',els=>els.length);
              assert(forced===1,`Style example filter expected 1 card, got ${forced}`);
              await stylePage.evaluate(()=>{
                const input=document.querySelector('#stylesearch');
                input.value='';
                input.dispatchEvent(new Event('input',{bubbles:true}));
              });
              await stylePage.waitForFunction(()=>document.querySelectorAll('.atlas-grid > .atlas-card').length===14);
            }

            const styleSlugs=await stylePage.evaluate(()=>window.UI_AR_DATA.styles.map(s=>s.slug));
            for(const slug of styleSlugs){
              await stylePage.evaluate(s=>{location.hash='#/style/'+s},slug);
              await stylePage.waitForFunction(s=>{
                const d=document.querySelector('.style-detail');
                return location.hash==='#/style/'+s &&
                  !!d &&
                  !!d.querySelector('.style-detail-visual .style-visual') &&
                  !!d.querySelector('.style-signal') &&
                  !!d.querySelector('.style-brief') &&
                  !!d.querySelector('.style-dna .dna-row') &&
                  !!d.querySelector('.style-code-table tr') &&
                  !!d.querySelector('.style-access li') &&
                  !!d.querySelector('.style-related a');
              },{timeout:10000},slug);
              const check=await stylePage.evaluate(()=>({
                h1:document.querySelector('.style-detail h1')?.textContent?.trim(),
                signals:document.querySelectorAll('.style-signal').length,
                dna:document.querySelectorAll('.style-dna .dna-row').length,
                codeRows:document.querySelectorAll('.style-code-table tr').length,
                access:document.querySelectorAll('.style-access li').length,
                related:document.querySelectorAll('.style-related a').length,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              }));
              assert(!!check.h1,`Missing style title for ${slug}`);
              assert(check.signals>=3,`Expected >=3 signals for ${slug}, got ${check.signals}`);
              assert(check.dna>=5,`Expected >=5 DNA rows for ${slug}, got ${check.dna}`);
              assert(check.codeRows>=1,`Missing style code rows for ${slug}`);
              assert(check.access>=3,`Expected accessibility guidance for ${slug}`);
              assert(check.related>=1,`Missing related styles for ${slug}`);
              assert(check.overflow<=2,`Style detail horizontal overflow ${check.overflow}px for ${slug} at ${width}px`);
            }
            assert(styleErrors.length===0,`Style page errors at ${width}px: ${styleErrors.join(' | ')}`);
            await stylePage.close();
          }
          console.log('LIVE STYLES QA PASSED — atlas + all 14 style pages valid at mobile and desktop widths.');

          async function stage19Qa(){
            for(const width of [393,1440]){
              const p=await browser.newPage();
              await p.setViewport({width,height:1000,deviceScaleFactor:1});
              const errors=[];
              p.on('pageerror',e=>errors.push(String(e)));

              await p.goto(site+'?contentqa=19#/compare',{waitUntil:'networkidle0',timeout:60000});
              await p.waitForSelector('.confused-grid > .confused-card');
              const comp=await p.evaluate(()=>({
                cards:document.querySelectorAll('.confused-grid > .confused-card').length,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              }));
              assert(comp.cards===18,`Expected 18 comparison cards, got ${comp.cards} at ${width}px`);
              assert(comp.overflow<=2,`Comparison index overflow ${comp.overflow}px at ${width}px`);

              const comparisonSlugs=await p.evaluate(()=>window.UI_AR_DATA.comparisons.map(c=>c.slug));
              for(const slug of comparisonSlugs){
                await p.evaluate(s=>{location.hash='#/vs/'+s},slug);
                await p.waitForFunction(s=>{
                  const d=document.querySelector('.vs-detail');
                  return location.hash==='#/vs/'+s && !!d && d.querySelectorAll('.vs-showcase .vs-entry').length>=1 && d.querySelectorAll('.vs-rules li').length>=1;
                },{timeout:10000},slug);
                const c=await p.evaluate(()=>({
                  entries:document.querySelectorAll('.vs-showcase .vs-entry').length,
                  rules:document.querySelectorAll('.vs-rules li').length,
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                }));
                assert(c.entries>=1,`Missing comparison entries for ${slug}`);
                assert(c.rules>=1,`Missing comparison rules for ${slug}`);
                assert(c.overflow<=2,`Comparison detail overflow ${c.overflow}px for ${slug}`);
              }

              await p.evaluate(()=>{location.hash='#/translate'});
              await p.waitForFunction(()=>document.querySelectorAll('.translation-v2 tbody tr').length===63);
              const trans=await p.evaluate(()=>({
                rows:document.querySelectorAll('.translation-v2 tbody tr').length,
                linked:document.querySelectorAll('.translation-v2 tbody td:first-child a').length,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              }));
              assert(trans.rows===63,`Translation table expected 63 rows, got ${trans.rows}`);
              assert(trans.linked>=55,`Translation table expected at least 55 linked terms, got ${trans.linked}`);
              assert(trans.overflow<=2,`Translation page overflow ${trans.overflow}px at ${width}px`);
              await p.type('#tsearch','NSButton');
              await p.waitForFunction(()=>document.querySelectorAll('.translation-v2 tbody tr').length>0 && document.querySelectorAll('.translation-v2 tbody tr').length<63);
              await p.evaluate(()=>{
                const i=document.querySelector('#tsearch');i.value='';i.dispatchEvent(new Event('input',{bubbles:true}));
              });
              await p.waitForFunction(()=>document.querySelectorAll('.translation-v2 tbody tr').length===63);

              await p.evaluate(()=>{location.hash='#/methodology'});
              await p.waitForSelector('.methodology');
              const method=await p.evaluate(()=>({
                steps:document.querySelectorAll('.method-steps>div').length,
                sources:document.querySelectorAll('.source-card').length,
                principles:document.querySelectorAll('.method-principles>div').length,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              }));
              assert(method.steps===3,`Methodology expected 3 steps, got ${method.steps}`);
              assert(method.sources===4,`Methodology expected 4 source cards, got ${method.sources}`);
              assert(method.principles===3,`Methodology expected 3 translation principles, got ${method.principles}`);
              assert(method.overflow<=2,`Methodology overflow ${method.overflow}px at ${width}px`);

              await p.evaluate(()=>{location.hash='#/guides'});
              await p.waitForSelector('.guide-hub-grid');
              const hub=await p.evaluate(()=>({
                cards:document.querySelectorAll('.guide-hub-card').length,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              }));
              assert(hub.cards===3,`Guides hub expected 3 cards, got ${hub.cards}`);
              assert(hub.overflow<=2,`Guides hub overflow ${hub.overflow}px at ${width}px`);

              for(const kind of ['appkit-swiftui','swift-electron']){
                await p.evaluate(k=>{location.hash='#/guide/'+k},kind);
                await p.waitForSelector('.guide-v2 .guide-prose');
                const g=await p.evaluate(()=>({
                  title:document.querySelector('.guide-v2 h1')?.textContent?.trim(),
                  sections:document.querySelectorAll('.guide-prose h2').length,
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                }));
                assert(!!g.title,`Missing guide title for ${kind}`);
                assert(g.sections>=2,`Guide ${kind} expected at least 2 sections`);
                assert(g.overflow<=2,`Guide ${kind} overflow ${g.overflow}px at ${width}px`);
              }
              assert(errors.length===0,`Content page errors at ${width}px: ${errors.join(' | ')}`);
              await p.close();
            }

            const direct=await browser.newPage();
            await direct.setViewport({width:393,height:800,deviceScaleFactor:1});
            await direct.goto(site+'vs/masonry-vs-bento/',{waitUntil:'networkidle0',timeout:60000});
            await direct.waitForSelector('.vs-detail');
            assert(await direct.$('.vs-detail h1'), 'Direct comparison route failed');
            await direct.goto(site+'guides/',{waitUntil:'networkidle0',timeout:60000});
            await direct.waitForSelector('.guide-hub-grid');
            assert((await direct.$$('.guide-hub-card')).length===3,'Direct guides route failed');
            await direct.close();

            console.log('LIVE CONTENT QA PASSED — comparisons, translations, methodology and guides valid on mobile and desktop.');
          }
          await stage19Qa();

          async function stage20Qa(){
            const p=await browser.newPage();
            await p.setViewport({width:393,height:1000,deviceScaleFactor:1});
            const errors=[];
            p.on('pageerror',e=>errors.push(String(e)));

            // Glossary: complete dataset, filtering and direct route.
            await p.goto(site+'glossary/',{waitUntil:'networkidle0',timeout:60000});
            await p.waitForSelector('.glossary-page .glossary-row');
            let g=await p.evaluate(()=>({
              rows:document.querySelectorAll('.glossary-row').length,
              terms:Object.keys(window.UI_AR_DATA.glossary||{}).length,
              canonical:document.querySelector('link[rel="canonical"]')?.href,
              robots:document.querySelector('meta[name="robots"]')?.content,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            assert(g.terms===38,`Glossary data expected 38 terms, got ${g.terms}`);
            assert(g.rows===38,`Glossary page expected 38 rows, got ${g.rows}`);
            assert(g.canonical.endsWith('/glossary/'),'Glossary canonical is wrong');
            assert(g.robots.startsWith('index'),'Glossary should be indexable');
            assert(g.overflow<=2,`Glossary overflow ${g.overflow}px`);
            await p.type('#gsearch','AppKit');
            await p.waitForFunction(()=>document.querySelectorAll('.glossary-row').length>0&&document.querySelectorAll('.glossary-row').length<38);

            // Saved: local-only persistence, remove one, clear all, noindex.
            await p.evaluate(()=>{
              localStorage.setItem('saved-ui-ar',JSON.stringify(['data-table','tabs']));
              location.hash='#/saved';
            });
            await p.waitForFunction(()=>document.querySelectorAll('.saved-entry').length===2);
            let saved=await p.evaluate(()=>({
              count:document.querySelectorAll('.saved-entry').length,
              robots:document.querySelector('meta[name="robots"]')?.content,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            assert(saved.count===2,'Saved page did not render 2 stored items');
            assert(saved.robots.startsWith('noindex'),'Saved page must be noindex');
            assert(saved.overflow<=2,`Saved overflow ${saved.overflow}px`);
            await p.click('[data-saved-remove="data-table"]');
            await p.waitForFunction(()=>document.querySelectorAll('.saved-entry').length===1);
            await p.click('#clearSaved');
            await p.waitForSelector('.saved-empty');
            assert((await p.evaluate(()=>JSON.parse(localStorage.getItem('saved-ui-ar')||'[]').length))===0,'Saved clear did not persist');

            // Submit: required fields -> structured proposal -> GitHub issue URL.
            await p.evaluate(()=>{location.hash='#/submit'});
            await p.waitForSelector('#submitform');
            await p.type('#seen','زر صغير يفتح قائمة إجراءات إضافية');
            await p.select('#where','Web');
            await p.type('#guess','Overflow Menu');
            await p.type('#reference','https://example.com/reference');
            await p.click('#submitform button[type="submit"]');
            await p.waitForFunction(()=>!document.querySelector('#proposalBox').hidden);
            const submit=await p.evaluate(()=>({
              proposal:document.querySelector('#proposal')?.textContent||'',
              issue:document.querySelector('#openIssue')?.href||'',
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            assert(submit.proposal.includes('Overflow Menu'),'Submit proposal missing expected name');
            assert(submit.issue.includes('github.com/mmashharawi2021-cell/Library-/issues/new'),'Submit issue URL is wrong');
            assert(submit.overflow<=2,`Submit overflow ${submit.overflow}px`);

            // Final whole-site responsive + dark/light sweep over every route family.
            const routeData=await p.evaluate(()=>({
              elements:window.UI_AR_DATA.entries.map(e=>'element/'+e.slug),
              styles:window.UI_AR_DATA.styles.map(s=>'style/'+s.slug),
              vs:window.UI_AR_DATA.comparisons.map(c=>'vs/'+c.slug)
            }));
            const routes=['','styles','compare','translate','methodology','guides','glossary','saved','submit','guide/appkit-swiftui','guide/swift-electron',...routeData.elements,...routeData.styles,...routeData.vs];
            for(const width of [393,1440]){
              await p.setViewport({width,height:1000,deviceScaleFactor:1});
              for(const theme of ['dark','light']){
                await p.evaluate(t=>{document.documentElement.dataset.theme=t},theme);
                for(const route of routes){
                  await p.evaluate(r=>{location.hash='#/'+r},route);
                  await p.waitForFunction(r=>location.hash==='#/'+r,{timeout:10000},route);
                  const check=await p.evaluate(()=>({
                    main:!!document.querySelector('#main'),
                    overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                    title:document.title,
                    canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                    theme:document.documentElement.dataset.theme
                  }));
                  assert(check.main,`Missing main for ${route||'home'} at ${width}px ${theme}`);
                  assert(check.overflow<=2,`Overflow ${check.overflow}px for ${route||'home'} at ${width}px ${theme}`);
                  assert(!!check.title&&check.title.trim().length>3,`Missing title for ${route||'home'}`);
                  assert(!!check.canonical,`Missing canonical for ${route||'home'}`);
                  assert(check.theme===theme,`Theme mismatch for ${route||'home'}`);
                }
              }
            }

            // Theme persistence through the actual header control.
            await p.evaluate(()=>{location.hash='#/'});
            await p.waitForSelector('#themeToggle');
            await p.evaluate(()=>{document.documentElement.dataset.theme='dark';localStorage.setItem('ui-theme','dark')});
            await p.click('#themeToggle');
            assert((await p.evaluate(()=>document.documentElement.dataset.theme))==='light','Theme toggle did not switch to light');
            assert((await p.evaluate(()=>localStorage.getItem('ui-theme')))==='light','Theme preference was not persisted');

            // Direct metadata checks. Sitemap integrity is validated deterministically from dist before deployment.
            await p.goto(site+'submit/',{waitUntil:'networkidle0',timeout:60000});
            await p.waitForSelector('.submit-page');
            const seo=await p.evaluate(()=>({
              title:document.title,
              canonical:document.querySelector('link[rel="canonical"]')?.href,
              ogTitle:document.querySelector('meta[property="og:title"]')?.content,
              twitterTitle:document.querySelector('meta[name="twitter:title"]')?.content
            }));
            assert(seo.canonical.endsWith('/submit/'),'Submit canonical is wrong');
            assert(seo.ogTitle===seo.title,'Static Open Graph title does not match document title');
            assert(seo.twitterTitle===seo.title,'Static Twitter title does not match document title');

            assert(errors.length===0,`V20 page errors: ${errors.join(' | ')}`);
            await p.close();
            console.log('LIVE V20 FINAL QA PASSED — Glossary, Saved, Submit, responsive sweep, light mode and SEO valid.');
          }
          await stage20Qa();

          async function stage21Qa(){
            for(const width of [393,1440]){
              const p=await browser.newPage();
              await p.setViewport({width,height:1100,deviceScaleFactor:1});
              const errors=[];
              p.on('pageerror',e=>errors.push(String(e)));
              await p.goto(site+'?homeqa=21#/',{waitUntil:'networkidle0',timeout:60000});
              await p.waitForFunction(()=>document.querySelectorAll('#cards > .entry-card').length===81);

              const home=await p.evaluate(()=>({
                sponsor:document.querySelectorAll('.sponsor-strip').length,
                sponsorLink:document.querySelector('.sponsor-strip a')?.textContent?.trim()||'',
                oldSourceStrip:document.querySelectorAll('.source-strip').length,
                navLinks:document.querySelectorAll('.sitehead .navlinks a').length,
                headerSearch:document.querySelectorAll('#headerSearch,.headsearch').length,
                version:document.querySelector('.brandbadge')?.textContent?.trim()||'',
                fresh:document.querySelectorAll('.newweek a').length,
                examples:document.querySelectorAll('.search-examples span').length,
                search:document.querySelectorAll('#search').length,
                surprise:document.querySelectorAll('#surprise').length,
                filters:document.querySelectorAll('.filter-tabs [data-cat]').length,
                sorts:document.querySelectorAll('.sort-tabs [data-sort]').length,
                cards:document.querySelectorAll('#cards > .entry-card').length,
                guides:document.querySelectorAll('.guidecards a').length,
                footerLinks:document.querySelectorAll('.footer .footlinks a').length,
                footerRss:document.querySelectorAll('.footer-rss a[href$="feed.xml"]').length,
                attribution:document.querySelector('.footer-attribution a')?.href||'',
                footerExtra:[...document.querySelectorAll('.footer .footlinks a')].some(a=>/المحفوظات|اقترح|المصطلحات|جدول الترجمة/.test(a.textContent)),
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                order:[
                  document.querySelector('.sponsor-strip')?.getBoundingClientRect().top,
                  document.querySelector('.sitehead')?.getBoundingClientRect().top,
                  document.querySelector('.hero')?.getBoundingClientRect().top,
                  document.querySelector('.catalog')?.getBoundingClientRect().top,
                  document.querySelector('.guides')?.getBoundingClientRect().top,
                  document.querySelector('.footer')?.getBoundingClientRect().top
                ]
              }));

              assert(home.sponsor===1,`Expected one sponsor strip at ${width}px`);
              assert(home.sponsorLink.includes('$500/شهر'),`Sponsor strip copy mismatch at ${width}px`);
              assert(home.oldSourceStrip===0,`Legacy reference strip still visible at ${width}px`);
              assert(home.navLinks===2,`Homepage header expected 2 primary links, got ${home.navLinks}`);
              assert(home.headerSearch===0,`Reference homepage should not show the old header search field`);
              assert(home.version==='22',`Visible version badge expected 22, got ${home.version}`);
              assert(home.fresh===3,`New this week expected 3 links, got ${home.fresh}`);
              assert(home.examples===5,`Search examples expected 5, got ${home.examples}`);
              assert(home.search===1,'Homepage search field missing');
              assert(home.surprise===0,'Surprise button must not exist in V21 parity homepage');
              assert(home.filters===3,`Expected 3 category filters, got ${home.filters}`);
              assert(home.sorts===2,`Expected 2 sort controls, got ${home.sorts}`);
              assert(home.cards===81,`Expected 81 cards, got ${home.cards}`);
              assert(home.guides===3,`Expected 3 guide cards, got ${home.guides}`);
              assert(home.footerLinks===3,`Footer expected 3 primary links, got ${home.footerLinks}`);
              assert(home.footerRss===1,'Footer RSS action missing');
              assert(home.attribution.includes('namethatui.com'),'Footer attribution to Name That UI missing');
              assert(!home.footerExtra,'V20-only utilities leaked back into primary footer');
              assert(home.overflow<=2,`Homepage overflow ${home.overflow}px at ${width}px`);
              assert(home.order.every(Number.isFinite)&&home.order.every((v,i,a)=>i===0||v>=a[i-1]),`Homepage section order mismatch at ${width}px: ${home.order.join(',')}`);

              await p.type('#search','zzzz-no-match-v21');
              await p.waitForFunction(()=>document.querySelectorAll('#cards > .entry-card').length===0&&!document.querySelector('#searchEmpty').hidden);
              const empty=await p.evaluate(()=>({
                visible:!document.querySelector('#searchEmpty').hidden,
                title:document.querySelector('#searchEmpty b')?.textContent?.trim()||''
              }));
              assert(empty.visible,'No-results state did not appear');
              assert(empty.title==='لا شيء يطابق هذا الوصف','No-results copy does not match reference structure');

              await p.evaluate(()=>{
                const i=document.querySelector('#search');
                i.value='';
                i.dispatchEvent(new Event('input',{bubbles:true}));
              });
              await p.waitForFunction(()=>document.querySelectorAll('#cards > .entry-card').length===81&&document.querySelector('#searchEmpty').hidden);
              assert(errors.length===0,`V21 homepage errors at ${width}px: ${errors.join(' | ')}`);
              await p.close();
            }
            console.log('LIVE V21 HOMEPAGE PARITY QA PASSED — sponsor/header/hero/examples/search/filters/cards/guides/footer valid at 393px and 1440px.');
          }
          await stage21Qa();

          async function stage22Qa(){
            const seed=await browser.newPage();
            await seed.goto(site+'?routes=22#/',{waitUntil:'networkidle0',timeout:60000});
            const entries=await seed.evaluate(()=>window.UI_AR_DATA.entries.map(e=>({slug:e.slug,category:e.category})));
            await seed.close();
            assert(entries.length===81,`V22 expected 81 entries, got ${entries.length}`);

            for(const width of [393,1440]){
              const p=await browser.newPage();
              await p.setViewport({width,height:1050,deviceScaleFactor:1});
              const errors=[];
              p.on('pageerror',e=>errors.push(String(e)));

              for(const [category,count] of [['web',49],['macos',32]]){
                const response=await p.goto(site+category+'/',{waitUntil:'networkidle0',timeout:60000});
                assert(response&&response.ok(),`HTTP failure for /${category}/ at ${width}px`);
                await p.waitForFunction(c=>document.querySelectorAll('#cards > .entry-card').length===c,{timeout:10000},count);
                const indexCheck=await p.evaluate(category=>({
                  cards:document.querySelectorAll('#cards > .entry-card').length,
                  canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                  wrongLinks:[...document.querySelectorAll('#cards > .entry-card')].filter(a=>!a.getAttribute('href')?.includes('/'+category+'/')).length,
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                }),category);
                assert(indexCheck.cards===count,`/${category}/ expected ${count} cards, got ${indexCheck.cards}`);
                assert(indexCheck.canonical.endsWith('/'+category+'/'),`/${category}/ canonical mismatch`);
                assert(indexCheck.wrongLinks===0,`/${category}/ contains ${indexCheck.wrongLinks} cross-platform card URLs`);
                assert(indexCheck.overflow<=2,`/${category}/ overflow ${indexCheck.overflow}px at ${width}px`);
              }

              for(const entry of entries){
                const path=entry.category+'/'+entry.slug+'/';
                const response=await p.goto(site+path,{waitUntil:'networkidle0',timeout:60000});
                assert(response&&response.ok(),`HTTP failure for /${path} at ${width}px`);
                await p.waitForSelector('.detail',{timeout:10000});
                const check=await p.evaluate(({category,slug})=>({
                  h1:document.querySelector('.detail h1')?.textContent?.trim()||'',
                  actions:document.querySelectorAll('.detail-actions button').length,
                  crumbPlatform:document.querySelector('.crumbs a:last-of-type')?.getAttribute('href')||'',
                  kicker:document.querySelectorAll('.detail-kicker').length,
                  parts:document.querySelectorAll('.anatomy .part').length,
                  prompts:document.querySelectorAll('.prompt').length,
                  codeRows:document.querySelectorAll('.code-table tr').length,
                  related:document.querySelectorAll('.related a').length,
                  badRelated:[...document.querySelectorAll('.related a')].filter(a=>!(/\/(web|macos)\//.test(a.getAttribute('href')||''))).length,
                  oldEntryLinks:document.querySelectorAll('a[href*="/element/"]').length,
                  perDetailAttribution:document.querySelectorAll('.detail .detail-source-note').length,
                  canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                  pathname:location.pathname,
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                }),entry);
                assert(!!check.h1,`Missing title for /${path}`);
                assert(check.actions===3,`/${path} expected 3 detail actions, got ${check.actions}`);
                assert(check.crumbPlatform.endsWith('/'+entry.category+'/'),`/${path} platform breadcrumb mismatch`);
                assert(check.kicker===0,`/${path} still contains non-reference detail kicker`);
                assert(check.parts>0,`/${path} missing anatomy`);
                assert(check.prompts===2,`/${path} expected prompt + debug prompt`);
                assert(check.codeRows>0,`/${path} missing code rows`);
                assert(check.related>0,`/${path} missing See also links`);
                assert(check.badRelated===0,`/${path} has non-platform related links`);
                assert(check.oldEntryLinks===0,`/${path} still exposes /element/ links`);
                assert(check.perDetailAttribution===0,`/${path} still has duplicate detail attribution`);
                assert(check.canonical.endsWith('/'+path),`/${path} canonical mismatch: ${check.canonical}`);
                assert(check.pathname.endsWith('/'+path),`/${path} pathname mismatch: ${check.pathname}`);
                assert(check.overflow<=2,`/${path} overflow ${check.overflow}px at ${width}px`);
              }

              assert(errors.length===0,`V22 direct-route page errors at ${width}px: ${errors.join(' | ')}`);
              await p.close();
            }

            const legacy=await browser.newPage();
            await legacy.setViewport({width:393,height:800,deviceScaleFactor:1});
            for(const sample of [
              {old:'element/sign-in-form/',expected:'web/sign-in-form/'},
              {old:'element/save-panel/',expected:'macos/save-panel/'}
            ]){
              await legacy.goto(site+sample.old,{waitUntil:'networkidle0',timeout:60000});
              await legacy.waitForFunction(expected=>location.pathname.endsWith('/'+expected),{timeout:10000},sample.expected);
              assert(legacy.url().includes('/'+sample.expected),`Legacy redirect failed for ${sample.old}`);
            }
            await legacy.close();

            console.log('LIVE V22 ELEMENT ROUTE + DETAIL QA PASSED — 81 direct platform pages, category indexes and legacy redirects valid at 393px and 1440px.');
          }
          await stage22Qa();
          await browser.close();
          JS
          node card-qa.mjs
