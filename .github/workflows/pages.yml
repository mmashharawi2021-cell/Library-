name: Deploy V42 Final Parity Audit

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check app.js

      - name: Build static surface
        run: node scripts/build-static.mjs

      - name: Validate V42 parity + touch + semantic model
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('data.js','utf8');
          const first=src.indexOf('{'), last=src.lastIndexOf('}');
          const d=JSON.parse(src.slice(first,last+1));
          const baseline=JSON.parse(fs.readFileSync('qa/reference/name-that-ui-2026-10-05.json','utf8'));
          const app=fs.readFileSync('app.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const fallback=fs.readFileSync('404.html','utf8');
          const manifest=fs.readFileSync('manifest.webmanifest','utf8');
          const demoStart=app.indexOf('function demo(');
          const demoEnd=app.indexOf('const entryPath=',demoStart);
          const demoBlock=app.slice(demoStart,demoEnd);
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};

          assert(index.includes('ui-ar-release\" content=\"V42')&&fallback.includes('ui-ar-release\" content=\"V42'),'V42 release marker missing');
          assert(index.includes('styles.css?v=42')&&index.includes('data.js?v=42')&&index.includes('app.js?v=42'),'V42 cache bust missing');
          assert(!index.includes('\\\\n<script')&&!fallback.includes('\\\\n<script'),'Literal backslash-n leaked into HTML head');
          assert(manifest.includes('/Library-/?v=42'),'Manifest start_url is not V42');
          assert(app.includes("const RELEASE='V42'"),'V42 runtime release marker missing');
          assert(d.entries.length===baseline.counts.elements,'Expected 81 elements');
          assert(d.entries.filter(e=>e.category==='web').length===baseline.counts.web,'Expected 49 web elements');
          assert(d.entries.filter(e=>e.category==='macos').length===baseline.counts.macos,'Expected 32 macOS elements');
          assert(d.styles.length===baseline.counts.styles,'Expected 14 styles');
          assert(d.comparisons.length===baseline.counts.comparisons,'Expected 18 comparisons');
          assert(d.translations.length===baseline.counts.translations,'Expected 63 translations');
          assert((demoBlock.match(/case '/g)||[]).length===81,'Expected 81 explicit demo cases');
          assert(app.includes('data-demo-slug'),'V42 demos must expose data-demo-slug');
          assert(app.includes('data-demo-contract'),'V42 semantic contracts missing');
          assert(app.includes('const DEMO_CONTRACTS='),'V42 contract registry missing');
          assert(app.includes('function bindDemos('),'V42 semantic engine missing');
          assert(!app.includes('slugHash'),'Random hash animation assignment must be removed');
          assert(!app.includes('data-v37-mode'),'Random animation mode must be removed');
          assert(!app.includes("const modes=['lift','shift','tilt','pulse','spring','glow']"),'Generic animation modes must be removed');
          assert(app.includes("case 'data-table'")&&app.includes('slider-native')&&app.includes("contextmenu")&&app.includes("dragstart"),'V42 semantic handlers missing');
          assert(app.includes('context-longpress')&&app.includes('touch-drop')&&app.includes('parallax-swipe'),'V42 touch handlers missing');
          assert(app.includes('v41-touch-open')&&app.includes('v41-paused'),'V42 tap fallback states missing');

          const slugs=new Set(d.entries.map(e=>e.slug));
          for(const e of d.entries){
            assert(e.caption&&e.caption.trim(),e.slug+': missing caption');
            assert((e.calledPhrases||[]).length>=3,e.slug+': expected >=3 called phrases');
            assert((e.anatomy||[]).length>0,e.slug+': missing anatomy');
            assert(e.anatomy.every(p=>p.symbol),e.slug+': anatomy symbol missing');
            assert(e.debugSymptom&&e.debugSymptom.trim(),e.slug+': missing debug symptom');
            assert((e.inCode||[]).length>=4,e.slug+': expected >=4 in-code rows');
            assert((e.related||[]).length===4,e.slug+': expected exactly 4 related items');
            assert(e.related.every(s=>slugs.has(s)&&s!==e.slug),e.slug+': invalid related slug');
          }

          const styleSlugs=new Set(d.styles.map(s=>s.slug));
          for(const s of d.styles){
            assert((s.signalDetails||[]).length>=4,s.slug+': expected >=4 defining signals');
            assert((s.dna||[]).length===5,s.slug+': expected 5 DNA axes');
            assert((s.sources||[]).length>=2,s.slug+': expected >=2 sources');
            assert((s.relatedStyles||[]).length>=4,s.slug+': expected >=4 related styles');
            assert(s.relatedStyles.every(x=>styleSlugs.has(x)&&x!==s.slug),s.slug+': invalid related style');
          }

          const sitemap=fs.readFileSync('dist/sitemap.xml','utf8');
          assert((sitemap.match(/<loc>/g)||[]).length===122,'Expected 122 sitemap URLs');
          assert(!sitemap.includes('/element/'),'Legacy element URLs leaked into sitemap');
          assert(!sitemap.includes('/saved/'),'Saved route leaked into sitemap');

          for(const e of d.entries){
            assert(fs.existsSync(`dist/${e.category}/${e.slug}/index.html`),'Missing direct entry page: '+e.slug);
            assert(fs.existsSync(`dist/element/${e.slug}/index.html`),'Missing legacy entry redirect: '+e.slug);
          }

          console.log('V38 model validation passed', {
            entries:d.entries.length,
            styles:d.styles.length,
            comparisons:d.comparisons.length,
            translations:d.translations.length
          });
          NODE

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Install live QA browser
        run: npm install --no-save puppeteer-core@24

      - name: V42 live reference parity audit
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p qa-screenshots qa-reports
          cat > v42-live-parity.mjs <<'JS'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const clone=(process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/').replace(/\/?$/,'/');
          const ref='https://namethatui.com/';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          async function open(url,width=1440,height=1100){
            const p=await browser.newPage();
            await p.setViewport({width,height,deviceScaleFactor:1});
            await p.goto(url,{waitUntil:'networkidle2',timeout:90000});
            return p;
          }
          async function homeMetrics(url,isClone,width=1440){
            const p=await open(url,width,width<=700?900:1100);
            const m=await p.evaluate((isClone)=>{
              const rect=el=>el?el.getBoundingClientRect():null;
              const css=el=>el?getComputedStyle(el):null;
              const h1=document.querySelector('h1');
              const input=document.querySelector('input');
              let cards,first,elementCount=0;
              if(isClone){
                cards=[...document.querySelectorAll('#cards>.entry-card')];
                first=cards[0];
                elementCount=cards.length;
              }else{
                const links=[...document.querySelectorAll('a[href]')].filter(a=>/\/(web|macos)\/[^/]+\/?$/.test(new URL(a.href).pathname));
                cards=[...new Map(links.map(a=>[new URL(a.href).pathname,a])).values()];
                first=cards[0];
                const txt=document.body.innerText.replace(/\s+/g,' ');
                const m=txt.match(/All\s+All\s+(\d+)\s+macOS\s+macOS\s+(\d+)\s+Web\s+Web\s+(\d+)/i)||txt.match(/All\s+(\d+).*?macOS\s+(\d+).*?Web\s+(\d+)/i);
                elementCount=m?Number(m[1]):cards.length;
              }
              const r=rect(first),hr=rect(h1),ir=rect(input);
              return {
                title:h1?.textContent.trim()||'',
                elementCount,
                h1Font:parseFloat(css(h1)?.fontSize||0),
                h1Width:hr?.width||0,
                searchWidth:ir?.width||0,
                searchHeight:ir?.height||0,
                firstCardWidth:r?.width||0,
                firstCardHeight:r?.height||0,
                docWidth:document.documentElement.scrollWidth,
                viewport:innerWidth
              };
            },isClone);
            await p.screenshot({path:'qa-screenshots/v42-'+(isClone?'clone':'reference')+'-home-'+width+'.png',fullPage:true});
            await p.close(); return m;
          }
          async function routeMetrics(base,path,isClone,kind){
            const p=await open(base+path);
            const m=await p.evaluate((isClone,kind)=>{
              const unique=(arr)=>[...new Set(arr)];
              const hrefs=[...document.querySelectorAll('a[href]')].map(a=>new URL(a.href).pathname);
              const tableRows=[...document.querySelectorAll('table tbody tr')].length;
              if(kind==='styles'){
                const routes=unique(hrefs.filter(x=>/\/styles\/[^/]+\/?$/.test(x)&&x!='/styles/'));
                return {count:isClone?document.querySelectorAll('.atlas-card').length:routes.length,h1:document.querySelector('h1')?.textContent.trim()||''};
              }
              if(kind==='vs'){
                const routes=unique(hrefs.filter(x=>/\/vs\/[^/]+\/?$/.test(x)&&x!='/vs/'));
                return {count:isClone?document.querySelectorAll('.confused-card').length:routes.length,h1:document.querySelector('h1')?.textContent.trim()||''};
              }
              if(kind==='translate') return {count:tableRows,h1:document.querySelector('h1')?.textContent.trim()||''};
              if(kind==='methodology') return {steps:isClone?document.querySelectorAll('.method-steps>div').length:3,h2:[...document.querySelectorAll('h2')].map(x=>x.textContent.trim())};
              if(kind==='detail') return {
                actions:isClone?document.querySelectorAll('.detail-actions button').length:3,
                anatomy:isClone?document.querySelectorAll('.anatomy .part').length:[...document.body.innerText.matchAll(/\n\d+\.\s*\d+\n/g)].length,
                h1:document.querySelector('h1')?.textContent.trim()||'',
                codeTables:document.querySelectorAll('table').length
              };
              return {};
            },isClone,kind);
            await p.screenshot({path:'qa-screenshots/v42-'+(isClone?'clone':'reference')+'-'+kind+'.png',fullPage:true});
            await p.close();return m;
          }

          const report={generatedAt:new Date().toISOString(),reference:ref,clone};
          report.home1440={reference:await homeMetrics(ref,false,1440),clone:await homeMetrics(clone,true,1440)};
          report.home393={reference:await homeMetrics(ref,false,393),clone:await homeMetrics(clone,true,393)};
          for(const [kind,path] of [['styles','styles/'],['vs','vs/'],['translate','translate/'],['methodology','methodology/'],['detail','web/data-table/']]){
            report[kind]={reference:await routeMetrics(ref,path,false,kind),clone:await routeMetrics(clone,path,true,kind)};
          }

          fs.writeFileSync('qa-reports/v42-parity.json',JSON.stringify(report,null,2));
          console.log('V42_PARITY_REPORT '+JSON.stringify(report));
          const R=report.home1440.reference,C=report.home1440.clone;
          const ratio=(a,b)=>b?Math.abs(a-b)/b:0;
          assert(R.elementCount===81,'Live reference no longer reports 81 element entries; got '+R.elementCount);
          assert(C.elementCount===81,'Clone must expose 81 element entries');
          assert(report.styles.reference.count===14&&report.styles.clone.count===14,'Styles count parity failed');
          assert(report.vs.reference.count===18&&report.vs.clone.count===18,'Comparison count parity failed');
          assert(report.translate.reference.count>=60&&report.translate.clone.count>=60,'Translation table parity failed');
          assert(report.methodology.clone.steps===3,'Clone methodology must keep the three research steps');
          assert(report.detail.clone.actions===3,'Detail actions parity failed');
          assert(C.docWidth-C.viewport<=2,'Desktop clone horizontal overflow');
          assert(report.home393.clone.docWidth-report.home393.clone.viewport<=2,'Mobile clone horizontal overflow');
          assert(ratio(C.h1Font,R.h1Font)<=0.30,'Desktop hero title size diverges too far from reference');
          assert(ratio(C.searchWidth,R.searchWidth)<=0.35,'Desktop search width diverges too far from reference');
          if(R.firstCardWidth&&R.firstCardHeight&&C.firstCardWidth&&C.firstCardHeight){
            const arR=R.firstCardWidth/R.firstCardHeight,arC=C.firstCardWidth/C.firstCardHeight;
            assert(ratio(arC,arR)<=0.30,'Entry card aspect ratio diverges too far from reference');
          }
          console.log('LIVE V42 REFERENCE PARITY AUDIT PASSED');
          await browser.close();
          JS
          node v42-live-parity.mjs

      - name: V42 visual/reference parity QA
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > v42-parity-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser=await puppeteer.launch({
            headless:true,
            executablePath:'/usr/bin/google-chrome',
            args:['--no-sandbox']
          });
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};
          const site=process.env.SITE || 'https://mmashharawi2021-cell.github.io/Library-/';
          fs.mkdirSync('qa-screenshots',{recursive:true});

          const widths=[393,768,945,1440];

          for(const width of widths){
            const p=await browser.newPage();
            await p.setViewport({width,height:1200,deviceScaleFactor:1});
            const errors=[];
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto(site,{waitUntil:'networkidle0',timeout:60000});
            await p.waitForFunction(()=>document.querySelectorAll('#cards>.entry-card').length===81);

            const home=await p.evaluate(()=>({
              sponsor:document.querySelectorAll('.sponsor-strip').length,
              sponsorDots:document.querySelectorAll('.sponsor-dot').length,
              nav:document.querySelectorAll('.sitehead .navlinks a').length,
              headSearch:document.querySelectorAll('#headerSearch,.headsearch').length,
              theme:document.querySelectorAll('#themeToggle,.themebtn').length,
              brandBadge:document.querySelectorAll('.brandbadge').length,
              fresh:document.querySelectorAll('.newweek a').length,
              examples:document.querySelectorAll('.search-examples span').length,
              search:document.querySelectorAll('#search').length,
              surprise:document.querySelectorAll('#surprise,.surprise').length,
              filters:document.querySelectorAll('.filter-tabs [data-cat]').length,
              sorts:document.querySelectorAll('.sort-tabs [data-sort]').length,
              cards:document.querySelectorAll('#cards>.entry-card').length,
              demos:new Set([...document.querySelectorAll('#cards .ui-demo')].map(x=>[...x.classList].find(c=>c.startsWith('demo-')))).size,
              guides:document.querySelectorAll('.guidecards a').length,
              rss:document.querySelectorAll('.rss-button').length,
              footerLinks:document.querySelectorAll('.footer .footlinks a').length,
              footerSearch:document.querySelectorAll('#footerSearch').length,
              columns:getComputedStyle(document.querySelector('.entries-grid')).gridTemplateColumns.split(' ').length,
              release:document.documentElement.dataset.release||'',
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));

            assert(home.release==='V42','Live release marker is not V42');
            assert(home.sponsor===1&&home.sponsorDots===0,'Sponsor strip does not match V42 reference');
            assert(home.nav===2&&home.headSearch===0&&home.theme===0&&home.brandBadge===0,'Header chrome mismatch');
            assert(home.fresh===3&&home.examples===5&&home.search===1&&home.surprise===0,'Hero/search controls mismatch');
            assert(home.filters===3&&home.sorts===2&&home.cards===81&&home.demos===81,'Catalog mismatch');
            assert(home.guides===3,'Guide cards mismatch');
            assert(home.rss===1&&home.footerLinks===3&&home.footerSearch===1,'Footer mismatch');
            assert(home.columns===(width<=700?1:2),'Catalog column count mismatch at '+width+'px');
            assert(home.overflow<=2,'Horizontal overflow at '+width+'px: '+home.overflow);
            assert(errors.length===0,'Homepage JS errors at '+width+'px: '+errors.join(' | '));

            await p.screenshot({path:`qa-screenshots/v42-home-${width}.png`,fullPage:true});
            await p.close();
          }

          const detail=await browser.newPage();
          await detail.setViewport({width:1440,height:1200,deviceScaleFactor:1});
          await detail.goto(site+'web/data-table/',{waitUntil:'networkidle0',timeout:60000});
          await detail.waitForSelector('.detail');
          const dataTable=await detail.evaluate(()=>({
            caption:document.querySelector('.specimen-caption')?.textContent.trim()||'',
            called:document.querySelectorAll('.called span').length,
            parts:document.querySelectorAll('.anatomy .part').length,
            symbols:[...document.querySelectorAll('.anatomy .part code')].map(x=>x.textContent.trim()).filter(Boolean).length,
            debug:document.querySelectorAll('.debug-symptom').length,
            codeRows:document.querySelectorAll('.code-table tr').length,
            related:[...document.querySelectorAll('.related a')].map(a=>a.getAttribute('href')||''),
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
          }));
          assert(dataTable.caption.length>10,'Data Table caption missing');
          assert(dataTable.called===3,'Data Table called-phrases mismatch');
          assert(dataTable.parts===dataTable.symbols&&dataTable.parts>=4,'Data Table anatomy symbols incomplete');
          assert(dataTable.debug===1&&dataTable.codeRows>=4,'Data Table debug/code structure incomplete');
          for(const slug of ['pagination','outline-view','column-view','bento-grid']){
            assert(dataTable.related.some(h=>h.includes('/'+slug+'/')),'Data Table missing related '+slug);
          }
          assert(dataTable.overflow<=2,'Data Table overflow');
          await detail.screenshot({path:'qa-screenshots/v42-detail-data-table-1440.png',fullPage:true});
          await detail.close();

          const style=await browser.newPage();
          await style.setViewport({width:1440,height:1200,deviceScaleFactor:1});
          await style.goto(site+'styles/skeuomorphism/',{waitUntil:'networkidle0',timeout:60000});
          await style.waitForSelector('.style-detail');
          const skeu=await style.evaluate(()=>({
            signals:document.querySelectorAll('.style-signal').length,
            dna:document.querySelectorAll('.dna-row').length,
            sources:document.querySelectorAll('.style-source-links a').length,
            related:document.querySelectorAll('.style-related a').length,
            confused:document.querySelector('.style-section a[href*="/styles/neumorphism/"]')?.href||'',
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
          }));
          assert(skeu.signals>=4&&skeu.dna===5,'Skeuomorphism signals/DNA mismatch');
          assert(skeu.sources>=2&&skeu.related===5,'Skeuomorphism sources/related mismatch');
          assert(!!skeu.confused,'Skeuomorphism must compare with Neumorphism');
          assert(skeu.overflow<=2,'Style overflow');
          await style.screenshot({path:'qa-screenshots/v42-style-skeuomorphism-1440.png',fullPage:true});
          await style.close();

          const cmp=await browser.newPage();
          await cmp.setViewport({width:1440,height:1000,deviceScaleFactor:1});
          await cmp.goto(site+'vs/popover-vs-tooltip/',{waitUntil:'networkidle0',timeout:60000});
          await cmp.waitForSelector('.vs-detail');
          assert((await cmp.$$('.vs-rules li')).length>=4,'Popover vs Tooltip must expose >=4 checks');
          await cmp.screenshot({path:'qa-screenshots/v42-compare-popover-tooltip-1440.png',fullPage:true});
          await cmp.close();

          const content=await browser.newPage();
          await content.setViewport({width:1024,height:1100,deviceScaleFactor:1});
          await content.goto(site+'translate/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.translation-v2 tbody tr')).length===63,'Translation table expected 63 rows');
          await content.goto(site+'methodology/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.method-steps>div')).length===3,'Methodology expected 3 steps');
          assert((await content.$$('.source-card')).length===3,'Methodology expected 3 source groups');
          await content.goto(site+'appkit-vs-swiftui/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.guide-rules li')).length===3,'AppKit guide expected 3 rules');
          assert((await content.$$('.worked-prompts>div')).length===3,'AppKit guide expected 3 prompts');
          assert((await content.$$('.guide-faq details')).length===4,'AppKit guide expected 4 FAQs');
          await content.goto(site+'swift-vs-electron/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.guide-trade tbody tr')).length===6,'Swift/Electron expected 6 trade rows');
          assert((await content.$$('.worked-prompts.two>div')).length===2,'Swift/Electron expected 2 prompts');
          await content.close();

          // External reference is informative only; CI runners can be blocked by the source site.
          const ref=await browser.newPage();
          try{
            const response=await ref.goto('https://namethatui.com/',{waitUntil:'domcontentloaded',timeout:12000});
            if(response&&response.ok()){
              const body=await ref.evaluate(()=>document.body.innerText);
              assert(body.includes('All 81'),'Live reference count changed');
              assert(body.includes('macOS 32'),'Live reference macOS count changed');
              assert(body.includes('Web 49'),'Live reference Web count changed');
            }else{
              console.warn('Reference probe skipped:',response?.status());
            }
          }catch(err){
            console.warn('Reference probe skipped:',String(err));
          }
          await ref.close();

          console.log('LIVE V42 VISUAL QA PASSED — live-reference chrome, 81 element metadata, styles, comparisons, translation, methodology and guides validated.');
          await browser.close();
          JS
          node v42-parity-qa.mjs

      - name: V42 mobile UX QA — 393px
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > v42-mobile-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const site=process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/';
          const page=await browser.newPage();
          await page.setViewport({width:393,height:852,deviceScaleFactor:1,isMobile:true,hasTouch:true});
          await page.goto(site,{waitUntil:'networkidle0',timeout:60000});
          await page.waitForFunction(()=>document.querySelectorAll('#cards>.entry-card').length===81);
          const home=await page.evaluate(()=>{
            const css=x=>getComputedStyle(document.querySelector(x)),rect=x=>document.querySelector(x).getBoundingClientRect();
            return {
              release:document.documentElement.dataset.release,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              columns:css('.entries-grid').gridTemplateColumns.split(' ').length,
              searchHeight:rect('.hero-search').height,
              searchFont:parseFloat(css('.hero-search input').fontSize),
              titleFont:parseFloat(css('.entry-head h3').fontSize),
              bodyFont:parseFloat(css('.entry-body p').fontSize),
              cardWidth:rect('.entry-card').width,
              previewHeight:rect('.entry-preview').height,
              filterHeight:rect('.catalog-toolbar button').height,
              brandFont:parseFloat(css('.brand strong').fontSize),
              navFont:parseFloat(css('.navlinks a').fontSize)
            };
          });
          assert(home.release==='V42','Mobile page is not V42');
          assert(home.overflow<=2,'Mobile page has horizontal overflow: '+home.overflow);
          assert(home.columns===1,'Mobile catalog must be one column');
          assert(home.searchHeight>=46&&home.searchFont>=16,'Mobile search is too small');
          assert(home.titleFont>=15&&home.bodyFont>=12,'Mobile card copy is too small');
          assert(home.cardWidth>=350&&home.previewHeight>=180,'Mobile card/preview sizing is too small');
          assert(home.filterHeight>=40,'Mobile filter touch target is too small');
          assert(home.brandFont>=15&&home.navFont>=12,'Mobile header typography is too small');
          await page.tap('.filter-tabs [data-cat="web"]');
          await page.waitForFunction(()=>document.querySelectorAll('#cards>.entry-card').length===49);
          await page.tap('.filter-tabs [data-cat="all"]');
          await page.waitForFunction(()=>document.querySelectorAll('#cards>.entry-card').length===81);
          await page.screenshot({path:'qa-screenshots/v42-mobile-home-393.png',fullPage:true});

          await page.goto(site+'web/data-table/',{waitUntil:'networkidle0',timeout:60000});
          await page.waitForSelector('.detail');
          const detail=await page.evaluate(()=>{
            const css=x=>getComputedStyle(document.querySelector(x)),rect=x=>document.querySelector(x).getBoundingClientRect();
            return {
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              h1:parseFloat(css('.detail h1').fontSize),
              lead:parseFloat(css('.detail .lead').fontSize),
              actionHeight:rect('.detail-actions button').height,
              specimenHeight:rect('.specimen').height,
              relatedCols:css('.related').gridTemplateColumns.split(' ').length
            };
          });
          assert(detail.overflow<=2,'Mobile detail page has horizontal overflow');
          assert(detail.h1>=30&&detail.lead>=14,'Mobile detail typography is too small');
          assert(detail.actionHeight>=40,'Mobile detail actions are too small');
          assert(detail.specimenHeight>=220,'Mobile detail specimen is too small');
          assert(detail.relatedCols===1,'Mobile related cards should be one column');
          await page.screenshot({path:'qa-screenshots/v42-mobile-detail-393.png',fullPage:true});

          await page.goto(site+'styles/',{waitUntil:'networkidle0',timeout:60000});
          await page.waitForSelector('.atlas-grid');
          const styles=await page.evaluate(()=>({
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
            columns:getComputedStyle(document.querySelector('.atlas-grid')).gridTemplateColumns.split(' ').length,
            searchFont:parseFloat(getComputedStyle(document.querySelector('.styles-searchbox input')).fontSize)
          }));
          assert(styles.overflow<=2,'Mobile styles page has horizontal overflow');
          assert(styles.columns===1,'Mobile styles atlas must be one column');
          assert(styles.searchFont>=16,'Mobile styles search is too small');
          await page.screenshot({path:'qa-screenshots/v42-mobile-styles-393.png',fullPage:true});
          console.log('LIVE V42 MOBILE QA PASSED — readable typography, one-column cards, touch targets and no page overflow at 393px.');
          await browser.close();
          JS
          node v42-mobile-qa.mjs

      - name: V42 touch interaction QA — 393px
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > v42-touch-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const site=process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/';
          const page=await browser.newPage();
          await page.setViewport({width:393,height:852,deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(site,{waitUntil:'networkidle0',timeout:60000});
          await page.waitForFunction(()=>document.querySelectorAll('#cards .ui-demo').length===81);

          const bring=sel=>page.$eval(sel,x=>x.scrollIntoView({block:'center',inline:'center'}));

          await bring('.demo-hover-card');
          await page.tap('.demo-hover-card .hover-trigger');
          assert(await page.$eval('.demo-hover-card .hovercard',x=>x.classList.contains('v41-touch-open')),'Hover card tap fallback did not open');

          await bring('.demo-popover-dropdown-tooltip');
          await page.tap('.demo-popover-dropdown-tooltip .info');
          assert(await page.$eval('.demo-popover-dropdown-tooltip .overlay-kinds',x=>x.dataset.open==='tooltip'),'Tooltip tap fallback did not open');

          await bring('.demo-marquee');
          await page.tap('.demo-marquee .marquee');
          assert(await page.$eval('.demo-marquee .marquee',x=>x.classList.contains('v41-paused')),'Marquee did not pause on tap');

          await bring('.demo-pointer');
          await page.tap('.demo-pointer .cursors>span:first-child');
          assert(await page.$eval('.demo-pointer .cursors>span:first-child',x=>x.classList.contains('v41-selected')||x.classList.contains('v37-selected')),'Pointer specimen did not select on tap');

          await bring('.demo-lightbox');
          await page.tap('.demo-lightbox .thumb');
          assert(await page.$eval('.demo-lightbox .lightbox',x=>x.classList.contains('v39-open')),'Lightbox did not open on tap');
          await page.tap('.demo-lightbox .photo button');
          assert(await page.$eval('.demo-lightbox .lightbox',x=>!x.classList.contains('v39-open')),'Lightbox did not close on tap');

          await bring('.demo-slider-macos');
          const sliderTouch=await page.$eval('.demo-slider-macos .slider-native',async el=>{
            const r=el.getBoundingClientRect(),before=Number(el.value),sy=r.top+r.height/2,sx=r.left+r.width*.28,ex=r.left+r.width*.82;
            const mk=(x)=>new Touch({identifier:41,target:el,clientX:x,clientY:sy,pageX:x,pageY:sy,screenX:x,screenY:sy});
            el.dispatchEvent(new TouchEvent('touchstart',{bubbles:true,cancelable:true,touches:[mk(sx)],targetTouches:[mk(sx)],changedTouches:[mk(sx)]}));
            for(let i=1;i<=6;i++){const x=sx+(ex-sx)*i/6;el.dispatchEvent(new TouchEvent('touchmove',{bubbles:true,cancelable:true,touches:[mk(x)],targetTouches:[mk(x)],changedTouches:[mk(x)]}))}
            el.dispatchEvent(new TouchEvent('touchend',{bubbles:true,cancelable:true,touches:[],targetTouches:[],changedTouches:[mk(ex)]}));
            return {before,after:Number(el.value)};
          });
          assert(sliderTouch.after!==sliderTouch.before,'Slider TouchEvent drag did not change value');

          await bring('.demo-context-menu');
          await page.$eval('.demo-context-menu .fileitem',async item=>{
            const r=item.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,id=91;
            item.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:y}));
            await new Promise(r=>setTimeout(r,620));
            item.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:y}));
          });
          assert(await page.$eval('.demo-context-menu .fileitem',x=>x.classList.contains('v41-touch-open')&&x.getAttribute('aria-expanded')==='true'),'Context menu long press did not open');

          await bring('.demo-drag-drop');
          const dragResult=await page.$eval('.demo-drag-drop',async demo=>{
            const card=demo.querySelector('[data-dropzone]:first-child [data-drag-card]'),target=demo.querySelector('[data-dropzone]:last-child');
            const a=card.getBoundingClientRect(),b=target.getBoundingClientRect(),id=92;
            const sx=a.left+a.width/2,sy=a.top+a.height/2,ex=b.left+b.width/2,ey=b.top+b.height*.75;
            card.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:sx,clientY:sy}));
            for(let i=1;i<=6;i++){
              const x=sx+(ex-sx)*i/6,y=sy+(ey-sy)*i/6;
              card.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:y}));
              await new Promise(r=>setTimeout(r,20));
            }
            card.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:ex,clientY:ey}));
            return target.contains(card);
          });
          assert(dragResult,'Finger drag & drop did not move the Kanban card');

          await bring('.demo-parallax-scrolling');
          const par=await page.$eval('.demo-parallax-scrolling .parallax-ref',async el=>{
            const r=el.getBoundingClientRect(),id=93,x=r.left+r.width/2,sy=r.top+r.height*.72,ey=r.top+r.height*.28;
            const before=Number(el.dataset.offset||0);
            el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:sy}));
            el.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:ey}));
            el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,clientX:x,clientY:ey}));
            return {before,after:Number(el.dataset.offset||0)};
          });
          assert(par.after!==par.before,'Parallax did not react to vertical swipe');

          assert(errors.length===0,'V42 touch page errors: '+errors.join(' | '));
          await page.screenshot({path:'qa-screenshots/v42-touch-interactions-393.png',fullPage:true});
          console.log('LIVE V42 TOUCH QA PASSED — tap, long-press, native touch slider, finger drag/drop and parallax swipe validated.');
          await browser.close();
          JS
          node v42-touch-qa.mjs

      - name: V42 semantic interaction QA — 81 contracts
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > v42-semantic-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const site=process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/';
          const page=await browser.newPage();
          await page.setViewport({width:1440,height:1200,deviceScaleFactor:1});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(site,{waitUntil:'networkidle0',timeout:60000});
          await page.waitForFunction(()=>document.querySelectorAll('#cards .ui-demo').length===81);

          const structure=await page.evaluate(()=>({
            count:document.querySelectorAll('#cards .ui-demo').length,
            contracts:new Set([...document.querySelectorAll('#cards .ui-demo')].map(x=>x.dataset.demoContract)).size,
            unclassified:[...document.querySelectorAll('#cards .ui-demo')].filter(x=>!x.dataset.demoContract).length,
            nestedInteractiveLinks:[...document.querySelectorAll('#cards>.entry-card')].filter(c=>c.tagName==='A'||c.querySelector('a button,a input,a textarea,a select')).length,
            randomModes:document.querySelectorAll('[data-v37-mode]').length,
            genericAnim:document.querySelectorAll('.v37-animate').length
          }));
          assert(structure.count===81&&structure.unclassified===0,'All 81 demos need semantic contracts');
          assert(structure.contracts>=7,'Expected diverse interaction contracts');
          assert(structure.nestedInteractiveLinks===0,'Interactive previews must not be nested in a giant anchor');
          assert(structure.randomModes===0&&structure.genericAnim===0,'Random generic animation system still present');

          const staticCheck=await page.evaluate(()=>{
            const demos=[...document.querySelectorAll('[data-demo-contract="static"]')],before=demos.map(x=>x.dataset.interactionCount);
            demos.forEach(x=>x.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));
            return {count:demos.length,changed:demos.filter((x,i)=>x.dataset.interactionCount!==before[i]).map(x=>x.dataset.demoSlug)};
          });
          assert(staticCheck.count>=8,'Expected static presentation specimens');
          assert(staticCheck.changed.length===0,'Static demos reacted to arbitrary click: '+staticCheck.changed.join(','));

          await page.$eval('.demo-slider-macos',x=>x.scrollIntoView({block:'center'}));await new Promise(r=>setTimeout(r,80));
          const s0=Number(await page.$eval('.demo-slider-macos .slider-native',x=>x.value));
          await page.focus('.demo-slider-macos .slider-native');for(let i=0;i<8;i++)await page.keyboard.press('ArrowRight');
          const s1=Number(await page.$eval('.demo-slider-macos .slider-native',x=>x.value));assert(s1!==s0,'Native slider did not respond to keyboard/range interaction');
          assert(await page.$eval('.demo-slider-macos output',x=>x.textContent===document.querySelector('.demo-slider-macos .slider-native').value+'%'),'Slider output did not mirror value');

          const resizeNative=await page.$eval('.demo-resize-handle .resize-box',x=>({tag:x.tagName,resize:getComputedStyle(x).resize,overflow:getComputedStyle(x).overflow}));
          assert(resizeNative.tag==='TEXTAREA'&&resizeNative.resize!=='none','Resize specimen must use a native resizable textarea');
          assert(resizeNative.overflow==='auto'||resizeNative.overflow==='scroll','Resizable textarea must expose overflow for native resizing');

          await page.$eval('.demo-hover-card',x=>x.scrollIntoView({block:'center'}));await page.focus('.demo-hover-card .hover-trigger');await new Promise(r=>setTimeout(r,280));assert(await page.$eval('.demo-hover-card .profile',x=>x.closest('.hovercard').matches(':focus-within')&&Number(getComputedStyle(x).opacity)>.9),'Hover card did not open on hover/focus');
          await page.click('.demo-context-menu .fileitem',{button:'right'});assert(await page.$eval('.demo-context-menu .fileitem',x=>x.classList.contains('v39-open')),'Context menu did not open on right click');
          await page.click('.demo-toast .toast-trigger');assert(await page.$eval('.demo-toast .workspace',x=>x.classList.contains('v39-show-toast')),'Toast action did not show toast');
          await page.click('.demo-lightbox .thumb');assert(await page.$eval('.demo-lightbox .lightbox',x=>x.classList.contains('v39-open')),'Lightbox did not open from thumbnail');

          await page.$eval('.demo-scrollspy .doclines',x=>x.scrollTo(0,x.scrollHeight));await new Promise(r=>setTimeout(r,120));
          assert(await page.$eval('.demo-scrollspy .docs aside button:last-child',x=>x.classList.contains('on')),'Scrollspy did not follow scroll');

          await page.$eval('.demo-inspector input[type="color"]',x=>{x.value='#ff0000';x.dispatchEvent(new Event('input',{bubbles:true}))});await new Promise(r=>setTimeout(r,240));
          const bg=await page.$eval('.demo-inspector .canvas',x=>getComputedStyle(x).backgroundColor);assert(bg.includes('255'),'Inspector color control did not update canvas');

          const drop=await page.evaluate(()=>{
            const card=document.querySelector('.demo-drag-drop [draggable="true"]'),zones=[...document.querySelectorAll('.demo-drag-drop [data-dropzone]')],dt=new DataTransfer();
            card.dispatchEvent(new DragEvent('dragstart',{bubbles:true,dataTransfer:dt}));zones[1].dispatchEvent(new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:dt}));zones[1].dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt}));card.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:dt}));return zones[1].contains(card);
          });
          assert(drop,'Drag & drop did not move card');
          assert(errors.length===0,'V39 page errors: '+errors.join(' | '));
          await page.screenshot({path:'qa-screenshots/v42-semantic-1440.png',fullPage:true});
          await page.close();

          const touch=await browser.newPage();await touch.setViewport({width:393,height:900,deviceScaleFactor:1,isMobile:true,hasTouch:true});await touch.goto(site,{waitUntil:'networkidle0',timeout:60000});await touch.waitForSelector('.demo-bottom-navigation .nt-tabs');await touch.tap('.demo-bottom-navigation .nt-tabs>*:nth-child(2)');assert(await touch.$eval('.demo-bottom-navigation .nt-tabs>*:nth-child(2)',x=>x.classList.contains('on')),'Touch navigation failed');await touch.screenshot({path:'qa-screenshots/v42-semantic-touch-393.png',fullPage:true});await touch.close();

          console.log('LIVE V42 SEMANTIC QA PASSED — 81 contracts; static, click, hover, context, scroll, drag and form behavior validated.');
          await browser.close();
          JS
          node v42-semantic-qa.mjs

