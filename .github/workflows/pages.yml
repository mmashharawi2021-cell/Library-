name: Deploy V39 Semantic Mini-UIs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check app.js

      - name: Build static surface
        run: node scripts/build-static.mjs

      - name: Validate V39 semantic interaction model
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('data.js','utf8');
          const first=src.indexOf('{'), last=src.lastIndexOf('}');
          const d=JSON.parse(src.slice(first,last+1));
          const baseline=JSON.parse(fs.readFileSync('qa/reference/name-that-ui-2026-10-05.json','utf8'));
          const app=fs.readFileSync('app.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const fallback=fs.readFileSync('404.html','utf8');
          const manifest=fs.readFileSync('manifest.webmanifest','utf8');
          const demoStart=app.indexOf('function demo(');
          const demoEnd=app.indexOf('const entryPath=',demoStart);
          const demoBlock=app.slice(demoStart,demoEnd);
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};

          assert(index.includes('ui-ar-release\" content=\"V39')&&fallback.includes('ui-ar-release\" content=\"V39'),'V39 release marker missing');
          assert(index.includes('styles.css?v=39')&&index.includes('data.js?v=39')&&index.includes('app.js?v=39'),'V39 cache bust missing');
          assert(!index.includes('\\\\n<script')&&!fallback.includes('\\\\n<script'),'Literal backslash-n leaked into HTML head');
          assert(manifest.includes('/Library-/?v=39'),'Manifest start_url is not V39');
          assert(app.includes("const RELEASE='V39'"),'V39 runtime release marker missing');
          assert(d.entries.length===baseline.counts.elements,'Expected 81 elements');
          assert(d.entries.filter(e=>e.category==='web').length===baseline.counts.web,'Expected 49 web elements');
          assert(d.entries.filter(e=>e.category==='macos').length===baseline.counts.macos,'Expected 32 macOS elements');
          assert(d.styles.length===baseline.counts.styles,'Expected 14 styles');
          assert(d.comparisons.length===baseline.counts.comparisons,'Expected 18 comparisons');
          assert(d.translations.length===baseline.counts.translations,'Expected 63 translations');
          assert((demoBlock.match(/case '/g)||[]).length===81,'Expected 81 explicit demo cases');
          assert(app.includes('data-demo-slug'),'V39 demos must expose data-demo-slug');
          assert(app.includes('data-demo-contract'),'V39 semantic contracts missing');
          assert(app.includes('const DEMO_CONTRACTS='),'V39 contract registry missing');
          assert(app.includes('function bindDemos('),'V39 semantic engine missing');
          assert(!app.includes('slugHash'),'Random hash animation assignment must be removed');
          assert(!app.includes('data-v37-mode'),'Random animation mode must be removed');
          assert(!app.includes("const modes=['lift','shift','tilt','pulse','spring','glow']"),'Generic animation modes must be removed');
          assert(app.includes("case 'data-table'")&&app.includes('slider-native')&&app.includes("contextmenu")&&app.includes("dragstart"),'V39 semantic handlers missing');

          const slugs=new Set(d.entries.map(e=>e.slug));
          for(const e of d.entries){
            assert(e.caption&&e.caption.trim(),e.slug+': missing caption');
            assert((e.calledPhrases||[]).length>=3,e.slug+': expected >=3 called phrases');
            assert((e.anatomy||[]).length>0,e.slug+': missing anatomy');
            assert(e.anatomy.every(p=>p.symbol),e.slug+': anatomy symbol missing');
            assert(e.debugSymptom&&e.debugSymptom.trim(),e.slug+': missing debug symptom');
            assert((e.inCode||[]).length>=4,e.slug+': expected >=4 in-code rows');
            assert((e.related||[]).length===4,e.slug+': expected exactly 4 related items');
            assert(e.related.every(s=>slugs.has(s)&&s!==e.slug),e.slug+': invalid related slug');
          }

          const styleSlugs=new Set(d.styles.map(s=>s.slug));
          for(const s of d.styles){
            assert((s.signalDetails||[]).length>=4,s.slug+': expected >=4 defining signals');
            assert((s.dna||[]).length===5,s.slug+': expected 5 DNA axes');
            assert((s.sources||[]).length>=2,s.slug+': expected >=2 sources');
            assert((s.relatedStyles||[]).length>=4,s.slug+': expected >=4 related styles');
            assert(s.relatedStyles.every(x=>styleSlugs.has(x)&&x!==s.slug),s.slug+': invalid related style');
          }

          const sitemap=fs.readFileSync('dist/sitemap.xml','utf8');
          assert((sitemap.match(/<loc>/g)||[]).length===122,'Expected 122 sitemap URLs');
          assert(!sitemap.includes('/element/'),'Legacy element URLs leaked into sitemap');
          assert(!sitemap.includes('/saved/'),'Saved route leaked into sitemap');

          for(const e of d.entries){
            assert(fs.existsSync(`dist/${e.category}/${e.slug}/index.html`),'Missing direct entry page: '+e.slug);
            assert(fs.existsSync(`dist/element/${e.slug}/index.html`),'Missing legacy entry redirect: '+e.slug);
          }

          console.log('V38 model validation passed', {
            entries:d.entries.length,
            styles:d.styles.length,
            comparisons:d.comparisons.length,
            translations:d.translations.length
          });
          NODE

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Install live QA browser
        run: npm install --no-save puppeteer-core@24

      - name: V39 visual/reference parity QA
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > v39-parity-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser=await puppeteer.launch({
            headless:true,
            executablePath:'/usr/bin/google-chrome',
            args:['--no-sandbox']
          });
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};
          const site=process.env.SITE || 'https://mmashharawi2021-cell.github.io/Library-/';
          fs.mkdirSync('qa-screenshots',{recursive:true});

          const widths=[393,768,945,1440];

          for(const width of widths){
            const p=await browser.newPage();
            await p.setViewport({width,height:1200,deviceScaleFactor:1});
            const errors=[];
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto(site,{waitUntil:'networkidle0',timeout:60000});
            await p.waitForFunction(()=>document.querySelectorAll('#cards>.entry-card').length===81);

            const home=await p.evaluate(()=>({
              sponsor:document.querySelectorAll('.sponsor-strip').length,
              sponsorDots:document.querySelectorAll('.sponsor-dot').length,
              nav:document.querySelectorAll('.sitehead .navlinks a').length,
              headSearch:document.querySelectorAll('#headerSearch,.headsearch').length,
              theme:document.querySelectorAll('#themeToggle,.themebtn').length,
              brandBadge:document.querySelectorAll('.brandbadge').length,
              fresh:document.querySelectorAll('.newweek a').length,
              examples:document.querySelectorAll('.search-examples span').length,
              search:document.querySelectorAll('#search').length,
              surprise:document.querySelectorAll('#surprise,.surprise').length,
              filters:document.querySelectorAll('.filter-tabs [data-cat]').length,
              sorts:document.querySelectorAll('.sort-tabs [data-sort]').length,
              cards:document.querySelectorAll('#cards>.entry-card').length,
              demos:new Set([...document.querySelectorAll('#cards .ui-demo')].map(x=>[...x.classList].find(c=>c.startsWith('demo-')))).size,
              guides:document.querySelectorAll('.guidecards a').length,
              rss:document.querySelectorAll('.rss-button').length,
              footerLinks:document.querySelectorAll('.footer .footlinks a').length,
              footerSearch:document.querySelectorAll('#footerSearch').length,
              columns:getComputedStyle(document.querySelector('.entries-grid')).gridTemplateColumns.split(' ').length,
              release:document.documentElement.dataset.release||'',
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));

            assert(home.release==='V39','Live release marker is not V38');
            assert(home.sponsor===1&&home.sponsorDots===0,'Sponsor strip does not match V39 reference');
            assert(home.nav===2&&home.headSearch===0&&home.theme===0&&home.brandBadge===0,'Header chrome mismatch');
            assert(home.fresh===3&&home.examples===5&&home.search===1&&home.surprise===0,'Hero/search controls mismatch');
            assert(home.filters===3&&home.sorts===2&&home.cards===81&&home.demos===81,'Catalog mismatch');
            assert(home.guides===3,'Guide cards mismatch');
            assert(home.rss===1&&home.footerLinks===3&&home.footerSearch===1,'Footer mismatch');
            assert(home.columns===2,'Catalog must remain two columns');
            assert(home.overflow<=2,'Horizontal overflow at '+width+'px: '+home.overflow);
            assert(errors.length===0,'Homepage JS errors at '+width+'px: '+errors.join(' | '));

            await p.screenshot({path:`qa-screenshots/v39-home-${width}.png`,fullPage:true});
            await p.close();
          }

          const detail=await browser.newPage();
          await detail.setViewport({width:1440,height:1200,deviceScaleFactor:1});
          await detail.goto(site+'web/data-table/',{waitUntil:'networkidle0',timeout:60000});
          await detail.waitForSelector('.detail');
          const dataTable=await detail.evaluate(()=>({
            caption:document.querySelector('.specimen-caption')?.textContent.trim()||'',
            called:document.querySelectorAll('.called span').length,
            parts:document.querySelectorAll('.anatomy .part').length,
            symbols:[...document.querySelectorAll('.anatomy .part code')].map(x=>x.textContent.trim()).filter(Boolean).length,
            debug:document.querySelectorAll('.debug-symptom').length,
            codeRows:document.querySelectorAll('.code-table tr').length,
            related:[...document.querySelectorAll('.related a')].map(a=>a.getAttribute('href')||''),
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
          }));
          assert(dataTable.caption.length>10,'Data Table caption missing');
          assert(dataTable.called===3,'Data Table called-phrases mismatch');
          assert(dataTable.parts===dataTable.symbols&&dataTable.parts>=4,'Data Table anatomy symbols incomplete');
          assert(dataTable.debug===1&&dataTable.codeRows>=4,'Data Table debug/code structure incomplete');
          for(const slug of ['pagination','outline-view','column-view','bento-grid']){
            assert(dataTable.related.some(h=>h.includes('/'+slug+'/')),'Data Table missing related '+slug);
          }
          assert(dataTable.overflow<=2,'Data Table overflow');
          await detail.screenshot({path:'qa-screenshots/v39-detail-data-table-1440.png',fullPage:true});
          await detail.close();

          const style=await browser.newPage();
          await style.setViewport({width:1440,height:1200,deviceScaleFactor:1});
          await style.goto(site+'styles/skeuomorphism/',{waitUntil:'networkidle0',timeout:60000});
          await style.waitForSelector('.style-detail');
          const skeu=await style.evaluate(()=>({
            signals:document.querySelectorAll('.style-signal').length,
            dna:document.querySelectorAll('.dna-row').length,
            sources:document.querySelectorAll('.style-source-links a').length,
            related:document.querySelectorAll('.style-related a').length,
            confused:document.querySelector('.style-section a[href*="/styles/neumorphism/"]')?.href||'',
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
          }));
          assert(skeu.signals>=4&&skeu.dna===5,'Skeuomorphism signals/DNA mismatch');
          assert(skeu.sources>=2&&skeu.related===5,'Skeuomorphism sources/related mismatch');
          assert(!!skeu.confused,'Skeuomorphism must compare with Neumorphism');
          assert(skeu.overflow<=2,'Style overflow');
          await style.screenshot({path:'qa-screenshots/v39-style-skeuomorphism-1440.png',fullPage:true});
          await style.close();

          const cmp=await browser.newPage();
          await cmp.setViewport({width:1440,height:1000,deviceScaleFactor:1});
          await cmp.goto(site+'vs/popover-vs-tooltip/',{waitUntil:'networkidle0',timeout:60000});
          await cmp.waitForSelector('.vs-detail');
          assert((await cmp.$$('.vs-rules li')).length>=4,'Popover vs Tooltip must expose >=4 checks');
          await cmp.screenshot({path:'qa-screenshots/v39-compare-popover-tooltip-1440.png',fullPage:true});
          await cmp.close();

          const content=await browser.newPage();
          await content.setViewport({width:1024,height:1100,deviceScaleFactor:1});
          await content.goto(site+'translate/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.translation-v2 tbody tr')).length===63,'Translation table expected 63 rows');
          await content.goto(site+'methodology/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.method-steps>div')).length===3,'Methodology expected 3 steps');
          assert((await content.$$('.source-card')).length===3,'Methodology expected 3 source groups');
          await content.goto(site+'appkit-vs-swiftui/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.guide-rules li')).length===3,'AppKit guide expected 3 rules');
          assert((await content.$$('.worked-prompts>div')).length===3,'AppKit guide expected 3 prompts');
          assert((await content.$$('.guide-faq details')).length===4,'AppKit guide expected 4 FAQs');
          await content.goto(site+'swift-vs-electron/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.guide-trade tbody tr')).length===6,'Swift/Electron expected 6 trade rows');
          assert((await content.$$('.worked-prompts.two>div')).length===2,'Swift/Electron expected 2 prompts');
          await content.close();

          // External reference is informative only; CI runners can be blocked by the source site.
          const ref=await browser.newPage();
          try{
            const response=await ref.goto('https://namethatui.com/',{waitUntil:'domcontentloaded',timeout:12000});
            if(response&&response.ok()){
              const body=await ref.evaluate(()=>document.body.innerText);
              assert(body.includes('All 81'),'Live reference count changed');
              assert(body.includes('macOS 32'),'Live reference macOS count changed');
              assert(body.includes('Web 49'),'Live reference Web count changed');
            }else{
              console.warn('Reference probe skipped:',response?.status());
            }
          }catch(err){
            console.warn('Reference probe skipped:',String(err));
          }
          await ref.close();

          console.log('LIVE V39 VISUAL QA PASSED — live-reference chrome, 81 element metadata, styles, comparisons, translation, methodology and guides validated.');
          await browser.close();
          JS
          node v39-parity-qa.mjs

      - name: V39 semantic interaction QA — 81 contracts
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > v39-semantic-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const site=process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/';
          const page=await browser.newPage();
          await page.setViewport({width:1440,height:1200,deviceScaleFactor:1});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(site,{waitUntil:'networkidle0',timeout:60000});
          await page.waitForFunction(()=>document.querySelectorAll('#cards .ui-demo').length===81);

          const structure=await page.evaluate(()=>({
            count:document.querySelectorAll('#cards .ui-demo').length,
            contracts:new Set([...document.querySelectorAll('#cards .ui-demo')].map(x=>x.dataset.demoContract)).size,
            unclassified:[...document.querySelectorAll('#cards .ui-demo')].filter(x=>!x.dataset.demoContract).length,
            nestedInteractiveLinks:[...document.querySelectorAll('#cards>.entry-card')].filter(c=>c.tagName==='A'||c.querySelector('a button,a input,a textarea,a select')).length,
            randomModes:document.querySelectorAll('[data-v37-mode]').length,
            genericAnim:document.querySelectorAll('.v37-animate').length
          }));
          assert(structure.count===81&&structure.unclassified===0,'All 81 demos need semantic contracts');
          assert(structure.contracts>=7,'Expected diverse interaction contracts');
          assert(structure.nestedInteractiveLinks===0,'Interactive previews must not be nested in a giant anchor');
          assert(structure.randomModes===0&&structure.genericAnim===0,'Random generic animation system still present');

          const staticCheck=await page.evaluate(()=>{
            const demos=[...document.querySelectorAll('[data-demo-contract="static"]')],before=demos.map(x=>x.dataset.interactionCount);
            demos.forEach(x=>x.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));
            return {count:demos.length,changed:demos.filter((x,i)=>x.dataset.interactionCount!==before[i]).map(x=>x.dataset.demoSlug)};
          });
          assert(staticCheck.count>=8,'Expected static presentation specimens');
          assert(staticCheck.changed.length===0,'Static demos reacted to arbitrary click: '+staticCheck.changed.join(','));

          await page.$eval('.demo-slider-macos',x=>x.scrollIntoView({block:'center'}));await new Promise(r=>setTimeout(r,80));
          const s0=Number(await page.$eval('.demo-slider-macos .slider-native',x=>x.value));
          await page.focus('.demo-slider-macos .slider-native');for(let i=0;i<8;i++)await page.keyboard.press('ArrowRight');
          const s1=Number(await page.$eval('.demo-slider-macos .slider-native',x=>x.value));assert(s1!==s0,'Native slider did not respond to keyboard/range interaction');
          assert(await page.$eval('.demo-slider-macos output',x=>x.textContent===document.querySelector('.demo-slider-macos .slider-native').value+'%'),'Slider output did not mirror value');

          const resizeNative=await page.$eval('.demo-resize-handle .resize-box',x=>({tag:x.tagName,resize:getComputedStyle(x).resize,overflow:getComputedStyle(x).overflow}));
          assert(resizeNative.tag==='TEXTAREA'&&resizeNative.resize!=='none','Resize specimen must use a native resizable textarea');
          assert(resizeNative.overflow==='auto'||resizeNative.overflow==='scroll','Resizable textarea must expose overflow for native resizing');

          await page.$eval('.demo-hover-card',x=>x.scrollIntoView({block:'center'}));await page.focus('.demo-hover-card .hover-trigger');await new Promise(r=>setTimeout(r,280));assert(await page.$eval('.demo-hover-card .profile',x=>x.closest('.hovercard').matches(':focus-within')&&Number(getComputedStyle(x).opacity)>.9),'Hover card did not open on hover/focus');
          await page.click('.demo-context-menu .fileitem',{button:'right'});assert(await page.$eval('.demo-context-menu .fileitem',x=>x.classList.contains('v39-open')),'Context menu did not open on right click');
          await page.click('.demo-toast .toast-trigger');assert(await page.$eval('.demo-toast .workspace',x=>x.classList.contains('v39-show-toast')),'Toast action did not show toast');
          await page.click('.demo-lightbox .thumb');assert(await page.$eval('.demo-lightbox .lightbox',x=>x.classList.contains('v39-open')),'Lightbox did not open from thumbnail');

          await page.$eval('.demo-scrollspy .doclines',x=>x.scrollTo(0,x.scrollHeight));await new Promise(r=>setTimeout(r,120));
          assert(await page.$eval('.demo-scrollspy .docs aside button:last-child',x=>x.classList.contains('on')),'Scrollspy did not follow scroll');

          await page.$eval('.demo-inspector input[type="color"]',x=>{x.value='#ff0000';x.dispatchEvent(new Event('input',{bubbles:true}))});
          const bg=await page.$eval('.demo-inspector .canvas',x=>getComputedStyle(x).backgroundColor);assert(bg.includes('255'),'Inspector color control did not update canvas');

          const drop=await page.evaluate(()=>{
            const card=document.querySelector('.demo-drag-drop [draggable="true"]'),zones=[...document.querySelectorAll('.demo-drag-drop [data-dropzone]')],dt=new DataTransfer();
            card.dispatchEvent(new DragEvent('dragstart',{bubbles:true,dataTransfer:dt}));zones[1].dispatchEvent(new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:dt}));zones[1].dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt}));card.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:dt}));return zones[1].contains(card);
          });
          assert(drop,'Drag & drop did not move card');
          assert(errors.length===0,'V39 page errors: '+errors.join(' | '));
          await page.screenshot({path:'qa-screenshots/v39-semantic-1440.png',fullPage:true});
          await page.close();

          const touch=await browser.newPage();await touch.setViewport({width:393,height:900,deviceScaleFactor:1,isMobile:true,hasTouch:true});await touch.goto(site,{waitUntil:'networkidle0',timeout:60000});await touch.waitForSelector('.demo-bottom-navigation .nt-tabs');await touch.tap('.demo-bottom-navigation .nt-tabs>*:nth-child(2)');assert(await touch.$eval('.demo-bottom-navigation .nt-tabs>*:nth-child(2)',x=>x.classList.contains('on')),'Touch navigation failed');await touch.screenshot({path:'qa-screenshots/v39-semantic-touch-393.png',fullPage:true});await touch.close();

          console.log('LIVE V39 SEMANTIC QA PASSED — 81 contracts; static, click, hover, context, scroll, drag and form behavior validated.');
          await browser.close();
          JS
          node v39-semantic-qa.mjs

      - name: Upload V39 delivery screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v39-semantic-mini-uis
          path: qa-screenshots
          if-no-files-found: warn
          retention-days: 30
