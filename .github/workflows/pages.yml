        run: |
          cat > v45-semantic-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const site=process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/';
          const page=await browser.newPage();
          await page.setViewport({width:1440,height:1200,deviceScaleFactor:1});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(site,{waitUntil:'networkidle0',timeout:60000});
          await page.waitForFunction(()=>document.querySelectorAll('#cards .ui-demo').length===81);

          const structure=await page.evaluate(()=>({
            count:document.querySelectorAll('#cards .ui-demo').length,
            contracts:new Set([...document.querySelectorAll('#cards .ui-demo')].map(x=>x.dataset.demoContract)).size,
            unclassified:[...document.querySelectorAll('#cards .ui-demo')].filter(x=>!x.dataset.demoContract).length,
            nestedInteractiveLinks:[...document.querySelectorAll('#cards>.entry-card')].filter(c=>c.tagName==='A'||c.querySelector('a button,a input,a textarea,a select')).length,
            randomModes:document.querySelectorAll('[data-is-mode]').length,
            genericAnim:document.querySelectorAll('.is-animate').length
          }));
          assert(structure.count===81&&structure.unclassified===0,'All 81 demos need semantic contracts');
          assert(structure.contracts>=7,'Expected diverse interaction contracts');
          assert(structure.nestedInteractiveLinks===0,'Interactive previews must not be nested in a giant anchor');
          assert(structure.randomModes===0&&structure.genericAnim===0,'Random generic animation system still present');

          const staticCheck=await page.evaluate(()=>{
            const demos=[...document.querySelectorAll('[data-demo-contract="static"]')],before=demos.map(x=>x.dataset.interactionCount);
            demos.forEach(x=>x.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));
            return {count:demos.length,changed:demos.filter((x,i)=>x.dataset.interactionCount!==before[i]).map(x=>x.dataset.demoSlug)};
          });
          assert(staticCheck.count>=8,'Expected static presentation specimens');
          assert(staticCheck.changed.length===0,'Static demos reacted to arbitrary click: '+staticCheck.changed.join(','));

          await page.$eval('.demo-slider-macos',x=>x.scrollIntoView({block:'center'}));await new Promise(r=>setTimeout(r,80));
          const s0=Number(await page.$eval('.demo-slider-macos .slider-native',x=>x.value));
          await page.focus('.demo-slider-macos .slider-native');for(let i=0;i<8;i++)await page.keyboard.press('ArrowRight');
          const s1=Number(await page.$eval('.demo-slider-macos .slider-native',x=>x.value));assert(s1!==s0,'Native slider did not respond to keyboard/range interaction');
          assert(await page.$eval('.demo-slider-macos output',x=>x.textContent===document.querySelector('.demo-slider-macos .slider-native').value+'%'),'Slider output did not mirror value');

          const resizeNative=await page.$eval('.demo-resize-handle .resize-box',x=>({tag:x.tagName,resize:getComputedStyle(x).resize,overflow:getComputedStyle(x).overflow}));
          assert(resizeNative.tag==='TEXTAREA'&&resizeNative.resize!=='none','Resize specimen must use a native resizable textarea');
          assert(resizeNative.overflow==='auto'||resizeNative.overflow==='scroll','Resizable textarea must expose overflow for native resizing');

          await page.$eval('.demo-hover-card',x=>x.scrollIntoView({block:'center'}));await page.focus('.demo-hover-card .hover-trigger');await new Promise(r=>setTimeout(r,280));assert(await page.$eval('.demo-hover-card .profile',x=>x.closest('.hovercard').matches(':focus-within')&&Number(getComputedStyle(x).opacity)>.9),'Hover card did not open on hover/focus');
          await page.click('.demo-context-menu .fileitem',{button:'right'});assert(await page.$eval('.demo-context-menu .fileitem',x=>x.classList.contains('is-open')),'Context menu did not open on right click');
          await page.click('.demo-toast .toast-trigger');assert(await page.$eval('.demo-toast .workspace',x=>x.classList.contains('is-show-toast')),'Toast action did not show toast');
          await page.click('.demo-lightbox .thumb');assert(await page.$eval('.demo-lightbox .lightbox',x=>x.classList.contains('is-open')),'Lightbox did not open from thumbnail');

          await page.$eval('.demo-scrollspy .doclines',x=>x.scrollTo(0,x.scrollHeight));await new Promise(r=>setTimeout(r,120));
          assert(await page.$eval('.demo-scrollspy .docs aside button:last-child',x=>x.classList.contains('on')),'Scrollspy did not follow scroll');

          await page.$eval('.demo-inspector input[type="color"]',x=>{x.value='#ff0000';x.dispatchEvent(new Event('input',{bubbles:true}))});await new Promise(r=>setTimeout(r,240));
          const bg=await page.$eval('.demo-inspector .canvas',x=>getComputedStyle(x).backgroundColor);assert(bg.includes('255'),'Inspector color control did not update canvas');

          const drop=await page.evaluate(()=>{
            const card=document.querySelector('.demo-drag-drop [draggable="true"]'),zones=[...document.querySelectorAll('.demo-drag-drop [data-dropzone]')],dt=new DataTransfer();
            card.dispatchEvent(new DragEvent('dragstart',{bubbles:true,dataTransfer:dt}));zones[1].dispatchEvent(new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:dt}));zones[1].dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt}));card.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:dt}));return zones[1].contains(card);
          });
          assert(drop,'Drag & drop did not move card');
          assert(errors.length===0,'V39 page errors: '+errors.join(' | '));
          await page.screenshot({path:'qa-screenshots/v45-semantic-1440.png',fullPage:true});
          await page.close();

          const touch=await browser.newPage();await touch.setViewport({width:393,height:900,deviceScaleFactor:1,isMobile:true,hasTouch:true});await touch.goto(site,{waitUntil:'networkidle0',timeout:60000});await touch.waitForSelector('.demo-bottom-navigation .nt-tabs');await touch.tap('.demo-bottom-navigation .nt-tabs>*:nth-child(2)');assert(await touch.$eval('.demo-bottom-navigation .nt-tabs>*:nth-child(2)',x=>x.classList.contains('on')),'Touch navigation failed');await touch.screenshot({path:'qa-screenshots/v45-semantic-touch-393.png',fullPage:true});await touch.close();

          console.log('LIVE V45 SEMANTIC QA PASSED — 81 contracts; static, click, hover, context, scroll, drag and form behavior validated.');
          await browser.close();
