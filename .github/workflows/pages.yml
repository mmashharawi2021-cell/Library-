name: Deploy V45 True Parity

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check app.js

      - name: Build static surface
        run: node scripts/build-static.mjs

      - name: Validate V45 true parity model
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('data.js','utf8');
          const first=src.indexOf('{'), last=src.lastIndexOf('}');
          const d=JSON.parse(src.slice(first,last+1));
          const baseline=JSON.parse(fs.readFileSync('qa/reference/name-that-ui-2026-10-05.json','utf8'));
          const app=fs.readFileSync('app.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const fallback=fs.readFileSync('404.html','utf8');
          const manifest=fs.readFileSync('manifest.webmanifest','utf8');
          const demoStart=app.indexOf('function demo(');
          const demoEnd=app.indexOf('const entryPath=',demoStart);
          const demoBlock=app.slice(demoStart,demoEnd);
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};

          assert(index.includes('ui-ar-release\" content=\"V45')&&fallback.includes('ui-ar-release\" content=\"V45'),'V45 release marker missing');
          assert(index.includes('styles.css?v=45')&&index.includes('data.js?v=45')&&index.includes('app.js?v=45'),'V45 cache bust missing');
          assert(!index.includes('\\\\n<script')&&!fallback.includes('\\\\n<script'),'Literal backslash-n leaked into HTML head');
          {const m=JSON.parse(manifest);assert(m.id==='/Library-/'&&m.start_url==='/Library-/'&&m.scope==='/Library-/','Manifest production identity/start_url/scope invalid')}
          assert(app.includes("const RELEASE='V45'"),'V45 runtime release marker missing');
          assert(d.entries.length===baseline.counts.elements,'Expected 81 elements');
          assert(d.entries.filter(e=>e.category==='web').length===baseline.counts.web,'Expected 49 web elements');
          assert(d.entries.filter(e=>e.category==='macos').length===baseline.counts.macos,'Expected 32 macOS elements');
          assert(d.styles.length===baseline.counts.styles,'Expected 14 styles');
          assert(d.comparisons.length===baseline.counts.comparisons,'Expected 18 comparisons');
          assert(d.translations.length===baseline.counts.translations,'Expected 63 translations');
          assert((demoBlock.match(/case '/g)||[]).length===81,'Expected 81 explicit demo cases');
          assert(app.includes('data-demo-slug'),'V45 demos must expose data-demo-slug');
          assert(app.includes('data-demo-contract'),'V45 semantic contracts missing');
          assert(app.includes('const DEMO_CONTRACTS='),'V45 contract registry missing');
          assert(app.includes('function bindDemos('),'V45 semantic engine missing');
          assert(!app.includes('slugHash'),'Random hash animation assignment must be removed');
          assert(!app.includes('data-is-mode'),'Random animation mode must be removed');
          assert(!app.includes("const modes=['lift','shift','tilt','pulse','spring','glow']"),'Generic animation modes must be removed');
          assert(!/\b(?:v37|v39|v41)-/.test(app),'Versioned interaction state leaked into app.js');
          const css=fs.readFileSync('styles.css','utf8');
          assert(!/\b(?:v37|v39|v41)-/.test(css),'Versioned interaction state leaked into styles.css');
          assert(app.length<150000,'app.js production size budget exceeded');
          assert(css.length<240000,'styles.css production size budget exceeded');
          assert(src.length<380000,'data.js production size budget exceeded');
          for(const swName of ['sw.js','service-worker.js','serviceWorker.js']){
            const sw=fs.readFileSync(swName,'utf8');
            assert(sw.includes('registration.unregister()')&&sw.includes("release:'V45'"),swName+': legacy worker cleanup invalid');
            assert(!sw.includes("v','37"),swName+': stale V37 navigation remains');
          }
          assert(app.includes("case 'data-table'")&&app.includes('slider-native')&&app.includes("contextmenu")&&app.includes("dragstart"),'V45 semantic handlers missing');
          assert(app.includes('context-longpress')&&app.includes('touch-drop')&&app.includes('parallax-swipe'),'V45 touch handlers missing');
          assert(app.includes('is-touch-open')&&app.includes('is-paused'),'V45 tap fallback states missing');

          const slugs=new Set(d.entries.map(e=>e.slug));
          for(const e of d.entries){
            assert(e.caption&&e.caption.trim(),e.slug+': missing caption');
            assert((e.calledPhrases||[]).length>=3,e.slug+': expected >=3 called phrases');
            assert((e.anatomy||[]).length>0,e.slug+': missing anatomy');
            assert(e.anatomy.every(p=>p.symbol),e.slug+': anatomy symbol missing');
            assert(e.debugSymptom&&e.debugSymptom.trim(),e.slug+': missing debug symptom');
            assert((e.inCode||[]).length>=4,e.slug+': expected >=4 in-code rows');
            assert((e.related||[]).length===4,e.slug+': expected exactly 4 related items');
            assert(e.related.every(s=>slugs.has(s)&&s!==e.slug),e.slug+': invalid related slug');
          }

          const styleSlugs=new Set(d.styles.map(s=>s.slug));
          for(const s of d.styles){
            assert((s.signalDetails||[]).length>=4,s.slug+': expected >=4 defining signals');
            assert((s.dna||[]).length===5,s.slug+': expected 5 DNA axes');
            assert((s.sources||[]).length>=2,s.slug+': expected >=2 sources');
            assert((s.relatedStyles||[]).length>=4,s.slug+': expected >=4 related styles');
            assert(s.relatedStyles.every(x=>styleSlugs.has(x)&&x!==s.slug),s.slug+': invalid related style');
          }

          const sitemap=fs.readFileSync('dist/sitemap.xml','utf8');
          assert((sitemap.match(/<loc>/g)||[]).length===122,'Expected 122 sitemap URLs');
          assert((sitemap.match(/<lastmod>2026-10-05<\/lastmod>/g)||[]).length===122,'Expected lastmod on all sitemap URLs');
          const sourceSitemap=fs.readFileSync('sitemap.xml','utf8');
          assert((sourceSitemap.match(/<loc>/g)||[]).length===122,'Committed sitemap must contain 122 URLs');
          assert((sourceSitemap.match(/<lastmod>2026-10-05<\/lastmod>/g)||[]).length===122,'Committed sitemap lastmod mismatch');
          assert(!sitemap.includes('/element/'),'Legacy element URLs leaked into sitemap');
          assert(!sitemap.includes('/saved/'),'Saved route leaked into sitemap');

          for(const e of d.entries){
            assert(fs.existsSync(`dist/${e.category}/${e.slug}/index.html`),'Missing direct entry page: '+e.slug);
            assert(fs.existsSync(`dist/element/${e.slug}/index.html`),'Missing legacy entry redirect: '+e.slug);
            const committed=fs.readFileSync(`${e.category}/${e.slug}/index.html`,'utf8');
            assert(committed.includes('ui-ar-release" content="V45"')&&committed.includes('app.js?v=45'),'Committed direct page is stale: '+e.slug);
            assert(committed.includes(`rel="canonical" href="https://mmashharawi2021-cell.github.io/Library-/${e.category}/${e.slug}/"`),'Committed canonical mismatch: '+e.slug);
          }

          console.log('V45 production model validation passed', {
            entries:d.entries.length,
            styles:d.styles.length,
            comparisons:d.comparisons.length,
            translations:d.translations.length
          });
          NODE

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Install live QA browser
        run: npm install --no-save puppeteer-core@24

      - name: V45 production routes + SEO QA
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p qa-reports
          cat > v45-production-qa.mjs <<'JS'
          import fs from 'node:fs';
          const site=(process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/').replace(/\/?$/,'/');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const get=async url=>{
            const r=await fetch(url,{redirect:'follow',headers:{'user-agent':'UI-Arabic-V45-QA'}});
            return {r,text:await r.text()};
          };
          const sm=await get(site+'sitemap.xml');
          assert(sm.r.ok,'sitemap.xml unavailable');
          const urls=[...sm.text.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);
          assert(urls.length===122,'Expected 122 production sitemap URLs, got '+urls.length);
          assert((sm.text.match(/<lastmod>2026-10-05<\/lastmod>/g)||[]).length===122,'Sitemap lastmod coverage failed');

          const failures=[],results=[];
          let cursor=0;
          async function worker(){
            while(cursor<urls.length){
              const url=urls[cursor++];
              try{
                const {r,text}=await get(url);
                const canonical=(text.match(/<link rel="canonical" href="([^"]+)">/)||[])[1];
                const title=(text.match(/<title>([^<]+)<\/title>/)||[])[1]||'';
                const desc=(text.match(/<meta name="description" content="([^"]*)">/)||[])[1]||'';
                const release=(text.match(/ui-ar-release" content="([^"]+)"/)||[])[1];
                const robots=(text.match(/<meta name="robots" content="([^"]+)">/)||[])[1]||'';
                const ok=r.status===200&&canonical===url&&release==='V45'&&title.length>=8&&desc.length>=20&&robots.startsWith('index,follow')&&text.includes('id="site-jsonld"')&&text.includes('id="page-jsonld"')&&text.includes('styles.css?v=45')&&text.includes('app.js?v=45');
                results.push({url,status:r.status,canonical,title:title.slice(0,100),descLength:desc.length,release,ok});
                if(!ok)failures.push({url,status:r.status,canonical,release,title,descLength:desc.length,robots});
              }catch(e){failures.push({url,error:String(e)})}
            }
          }
          await Promise.all(Array.from({length:8},worker));
          assert(failures.length===0,'Production route/SEO failures: '+JSON.stringify(failures.slice(0,8)));

          const robots=await get(site+'robots.txt');
          assert(robots.r.ok&&robots.text.includes('Sitemap: '+site+'sitemap.xml'),'robots.txt sitemap declaration invalid');
          const manifestRes=await get(site+'manifest.webmanifest');
          const manifest=JSON.parse(manifestRes.text);
          assert(manifest.id==='/Library-/'&&manifest.start_url==='/Library-/'&&manifest.scope==='/Library-/','Manifest stable identity invalid');

          for(const asset of ['styles.css?v=45','app.js?v=45','data.js?v=45','icon.svg','feed.xml']){
            const a=await fetch(site+asset,{redirect:'follow'});
            assert(a.ok,'Production asset unavailable: '+asset);
          }
          for(const sw of ['sw.js','service-worker.js','serviceWorker.js']){
            const x=await get(site+sw);
            assert(x.r.ok&&x.text.includes('registration.unregister()')&&x.text.includes("release:'V45'"),'Compatibility worker invalid: '+sw);
          }

          const missing=await get(site+'__v45_missing_route__/');
          assert(missing.r.status===404,'Custom 404 must return HTTP 404');
          assert(/noindex,follow/.test(missing.text),'Custom 404 must be noindex');

          const feed=await get(site+'feed.xml');
          assert(feed.r.ok&&feed.text.includes('<rss version="2.0">')&&(feed.text.match(/<item>/g)||[]).length>=3,'RSS feed invalid');

          // GitHub Pages cannot emit custom 301/302 responses from static files.
          // Legacy routes therefore use canonical + meta refresh + location.replace.
          const legacy=await get(site+'element/data-table/');
          const legacyTarget=site+'web/data-table/';
          assert(
            legacy.r.ok &&
            legacy.text.includes('rel="canonical" href="'+legacyTarget+'"') &&
            legacy.text.includes('http-equiv="refresh"') &&
            legacy.text.includes('location.replace'),
            'Legacy element compatibility redirect failed'
          );

          const report={release:'V45',checkedAt:new Date().toISOString(),sitemapUrls:urls.length,failures,results};
          fs.writeFileSync('qa-reports/v45-production.json',JSON.stringify(report,null,2));
          console.log('V45 PRODUCTION ROUTE + SEO QA PASSED — '+urls.length+' indexable URLs verified.');
          JS
          node v45-production-qa.mjs

      - name: V45 reference contract parity audit
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p qa-screenshots qa-reports
          cat > v45-reference-contract.mjs <<'JS'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const clone=(process.env.SITE||'https://mmashharawi2021-cell.github.io/Library-/').replace(/\/?$/,'/');
          const reference='https://namethatui.com/';
          const contract=JSON.parse(fs.readFileSync('reference-v45.json','utf8'));
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          async function open(url,width=1440,height=1100){
            const p=await browser.newPage();
            await p.setViewport({width,height,deviceScaleFactor:1});
            await p.goto(url,{waitUntil:'networkidle2',timeout:90000});
            return p;
          }

          async function probeReference(){
            const p=await open(reference,1440,900);
            const result=await p.evaluate(()=>({
              title:document.title,
              h1:document.querySelector('h1')?.textContent.trim()||'',
              text:document.body.innerText.slice(0,600)
            }));
            const blocked=/security verification|verification successful|waiting for namethatui\.com/i.test(result.text)||result.h1==='namethatui.com';
            await p.screenshot({path:'qa-screenshots/v45-reference-access.png',fullPage:true});
            await p.close();
            return {blocked,...result};
          }

          async function homeMetrics(width){
            const p=await open(clone,width,width<=700?900:1100);
            await p.waitForFunction(()=>document.querySelectorAll('#cards>.entry-card').length===81);
            const m=await p.evaluate(()=>{
              const css=x=>getComputedStyle(document.querySelector(x));
              const rect=x=>document.querySelector(x).getBoundingClientRect();
              const filters=[...document.querySelectorAll('.filter-tabs button')].map(x=>({label:x.childNodes[0]?.textContent.trim(),count:Number(x.querySelector('span')?.textContent||0)}));
              return {
                release:document.documentElement.dataset.release,
                elementCount:document.querySelectorAll('#cards>.entry-card').length,
                filters,
                newWeek:document.querySelectorAll('.newweek a').length,
                guides:document.querySelectorAll('.guidecards>a').length,
                columns:css('.entries-grid').gridTemplateColumns.split(' ').length,
                h1Font:parseFloat(css('.hero h1').fontSize),
                searchBoxHeight:rect('.hero-search').height,
                searchInputFont:parseFloat(css('.hero-search input').fontSize),
                firstPreviewRatio:(()=>{const r=rect('.entry-preview');return r.width/r.height})(),
                docWidth:document.documentElement.scrollWidth,
                viewport:innerWidth
              };
            });
            await p.screenshot({path:'qa-screenshots/v45-clone-home-'+width+'.png',fullPage:true});
            await p.close();return m;
          }

          async function route(path,kind){
            const p=await open(clone+path,1440,1100);
            const m=await p.evaluate((kind)=>{
              if(kind==='styles')return {
                count:document.querySelectorAll('.atlas-card').length,
                search:!!document.querySelector('.styles-searchbox input'),
                calledCards:document.querySelectorAll('.atlas-called').length,
                h1:document.querySelector('h1')?.textContent.trim()||'',
                crumbs:document.querySelectorAll('.translate-crumbs').length
              };
              if(kind==='vs')return {
                count:document.querySelectorAll('.confused-row').length,
                h1:document.querySelector('h1')?.textContent.trim()||''
              };
              if(kind==='translate')return {
                count:document.querySelectorAll('.translation-v2 tbody tr').length,
                columns:document.querySelectorAll('.translation-v2 thead th').length,
                h1:document.querySelector('h1')?.textContent.trim()||''
              };
              if(kind==='methodology')return {
                steps:document.querySelectorAll('.method-steps>div').length,
                sourceGroups:document.querySelectorAll('.source-card').length,
                sections:document.querySelectorAll('.method-section').length
              };
              if(kind==='detail')return {
                actions:document.querySelectorAll('.detail-actions button').length,
                anatomy:document.querySelectorAll('.anatomy .part').length,
                sections:document.querySelectorAll('.detail .section').length,
                symbols:[...document.querySelectorAll('.detail-symbols code')].map(x=>x.textContent.trim()),
                related:document.querySelectorAll('.related a').length,
                called:document.querySelectorAll('.called span').length,
                codeRows:document.querySelectorAll('.code-table tr').length
              };
              return {};
            },kind);
            await p.screenshot({path:'qa-screenshots/v45-clone-'+kind+'.png',fullPage:true});
            await p.close();return m;
          }

          const report={
            generatedAt:new Date().toISOString(),
            contract,
            referenceAccess:await probeReference(),
            clone:{
              home1440:await homeMetrics(1440),
              home393:await homeMetrics(393),
              styles:await route('styles/','styles'),
              vs:await route('vs/','vs'),
              translate:await route('translate/','translate'),
              methodology:await route('methodology/','methodology'),
              detail:await route('web/data-table/','detail')
            }
          };

          const C=report.clone,c=contract;
          const filterMap=Object.fromEntries(C.home1440.filters.map(x=>[x.label,x.count]));
          assert(C.home1440.release==='V45','Clone is not V45');
          assert(C.home1440.elementCount===c.home.total,'Element count mismatch');
          assert(filterMap['الكل']===c.home.total,'All filter count mismatch');
          assert(filterMap['macOS']===c.home.macos,'macOS filter count mismatch');
          assert(filterMap['Web']===c.home.web,'Web filter count mismatch');
          assert(C.home1440.newWeek===c.home.newThisWeek,'New-this-week count mismatch');
          assert(C.home1440.guides===c.home.guides,'Guide card count mismatch');
          assert(C.home1440.columns===2,'Desktop catalog must be two columns');
          assert(C.home393.columns===c.mobile393.catalogColumns,'Mobile catalog column count mismatch');assert(C.home393.firstPreviewRatio>=c.mobile393.previewRatioMin&&C.home393.firstPreviewRatio<=c.mobile393.previewRatioMax,'Mobile preview ratio mismatch');
          assert(C.home1440.docWidth-C.home1440.viewport<=2,'Desktop horizontal overflow');
          assert(C.home393.docWidth-C.home393.viewport<=2,'Mobile horizontal overflow');
          assert(C.home393.searchBoxHeight>=46&&C.home393.searchInputFont>=16,'Mobile search parity failed');
          assert(C.styles.count===c.styles.count&&C.styles.search&&C.styles.calledCards===c.styles.count,'Styles parity failed');
          assert(C.vs.count===c.comparisons.count,'Commonly-confused count mismatch');
          assert(C.translate.count===c.translate.rows&&C.translate.columns===c.translate.columns&&C.translate.crumbs===1,'Translation table parity failed');
          assert(C.methodology.steps===c.methodology.steps,'Methodology steps mismatch');
          assert(C.methodology.sourceGroups===c.methodology.sourceGroups,'Methodology source groups mismatch');
          assert(C.detail.actions===c.dataTable.actions,'Data-table action count mismatch');
          assert(C.detail.anatomy===c.dataTable.anatomyParts,'Data-table anatomy mismatch');
          assert(C.detail.symbols.includes('<table>')&&C.detail.symbols.includes('NSTableView'),'Data-table top API symbols mismatch');
          assert(C.detail.called===c.dataTable.calledPhrases,'Data-table called-phrases mismatch');
          assert(C.detail.codeRows===c.dataTable.codeRows,'Data-table code-row mismatch');
          assert(C.detail.related===c.dataTable.related,'Data-table related-count mismatch');

          fs.writeFileSync('qa-reports/v45-parity.json',JSON.stringify(report,null,2));
          console.log('V45_REFERENCE_ACCESS '+JSON.stringify(report.referenceAccess));
          console.log('V45_PARITY_REPORT '+JSON.stringify(report.clone));
          console.log('V45 REFERENCE CONTRACT PARITY AUDIT PASSED');
          await browser.close();
          JS
          node v45-reference-contract.mjs

      - name: V45 visual/reference parity QA
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > v45-parity-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser=await puppeteer.launch({
            headless:true,
            executablePath:'/usr/bin/google-chrome',
            args:['--no-sandbox']
          });
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};
          const site=process.env.SITE || 'https://mmashharawi2021-cell.github.io/Library-/';
          fs.mkdirSync('qa-screenshots',{recursive:true});

          const widths=[393,768,945,1440];

          for(const width of widths){
            const p=await browser.newPage();
            await p.setViewport({width,height:1200,deviceScaleFactor:1});
            const errors=[];
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto(site,{waitUntil:'networkidle0',timeout:60000});
            await p.waitForFunction(()=>document.querySelectorAll('#cards>.entry-card').length===81);

            const home=await p.evaluate(()=>({
              sponsor:document.querySelectorAll('.sponsor-strip').length,
              sponsorDots:document.querySelectorAll('.sponsor-dot').length,
              nav:document.querySelectorAll('.sitehead .navlinks a').length,
              headSearch:document.querySelectorAll('#headerSearch,.headsearch').length,
              theme:document.querySelectorAll('#themeToggle,.themebtn').length,
              brandBadge:document.querySelectorAll('.brandbadge').length,
              fresh:document.querySelectorAll('.newweek a').length,
              examples:document.querySelectorAll('.search-examples span').length,
              search:document.querySelectorAll('#search').length,
              surprise:document.querySelectorAll('#surprise,.surprise').length,
              filters:document.querySelectorAll('.filter-tabs [data-cat]').length,
              sorts:document.querySelectorAll('.sort-tabs [data-sort]').length,
              cards:document.querySelectorAll('#cards>.entry-card').length,
              demos:new Set([...document.querySelectorAll('#cards .ui-demo')].map(x=>[...x.classList].find(c=>c.startsWith('demo-')))).size,
              guides:document.querySelectorAll('.guidecards a').length,
              rss:document.querySelectorAll('.rss-button').length,
              footerLinks:document.querySelectorAll('.footer .footlinks a').length,
              footerSearch:document.querySelectorAll('#footerSearch').length,
              columns:getComputedStyle(document.querySelector('.entries-grid')).gridTemplateColumns.split(' ').length,
              release:document.documentElement.dataset.release||'',
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));

            assert(home.release==='V45','Live release marker is not V45');
            assert(home.sponsor===1&&home.sponsorDots===0,'Sponsor strip does not match V42 reference');
            assert(home.nav===2&&home.headSearch===0&&home.theme===0&&home.brandBadge===0,'Header chrome mismatch');
            assert(home.fresh===3&&home.examples===5&&home.filters===3&&home.sorts===2&&home.guides===3,'Homepage reference structure mismatch');
            assert(home.fresh===3&&home.examples===5&&home.search===1&&home.surprise===0,'Hero/search controls mismatch');
            assert(home.filters===3&&home.sorts===2&&home.cards===81&&home.demos===81,'Catalog mismatch');
            assert(home.guides===3,'Guide cards mismatch');
            assert(home.rss===1&&home.footerLinks===3&&home.footerSearch===1,'Footer mismatch');
            assert(home.columns===(width<=700?1:2),'Catalog column count mismatch at '+width+'px');
            assert(home.overflow<=2,'Horizontal overflow at '+width+'px: '+home.overflow);
            assert(errors.length===0,'Homepage JS errors at '+width+'px: '+errors.join(' | '));

            await p.screenshot({path:`qa-screenshots/v45-home-${width}.png`,fullPage:true});
            await p.close();
          }

          const detail=await browser.newPage();
          await detail.setViewport({width:1440,height:1200,deviceScaleFactor:1});
          await detail.goto(site+'web/data-table/',{waitUntil:'networkidle0',timeout:60000});
          await detail.waitForSelector('.detail');
          const dataTable=await detail.evaluate(()=>({
            caption:document.querySelector('.specimen-caption')?.textContent.trim()||'',
            called:document.querySelectorAll('.called span').length,
            parts:document.querySelectorAll('.anatomy .part').length,
            symbols:[...document.querySelectorAll('.anatomy .part code')].map(x=>x.textContent.trim()).filter(Boolean).length,
            debug:document.querySelectorAll('.debug-symptom').length,
            codeRows:document.querySelectorAll('.code-table tr').length,
            related:[...document.querySelectorAll('.related a')].map(a=>a.getAttribute('href')||''),
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
          }));
