          await content.goto(site+'translate/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.translation-v2 tbody tr')).length===63,'Translation table expected 63 rows');
          await content.goto(site+'methodology/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.method-steps>div')).length===3,'Methodology expected 3 steps');
          assert((await content.$$('.source-card')).length===3,'Methodology expected 3 source groups');
          await content.goto(site+'appkit-vs-swiftui/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.guide-rules li')).length===3,'AppKit guide expected 3 rules');
          assert((await content.$$('.worked-prompts>div')).length===3,'AppKit guide expected 3 prompts');
          assert((await content.$$('.guide-faq details')).length===4,'AppKit guide expected 4 FAQs');
          await content.goto(site+'swift-vs-electron/',{waitUntil:'networkidle0',timeout:60000});
          assert((await content.$$('.guide-trade tbody tr')).length===6,'Swift/Electron expected 6 trade rows');
          assert((await content.$$('.worked-prompts.two>div')).length===2,'Swift/Electron expected 2 prompts');
          await content.close();

          // External reference is informative only; CI runners can be blocked by the source site.
          const ref=await browser.newPage();
          try{
            const response=await ref.goto('https://namethatui.com/',{waitUntil:'domcontentloaded',timeout:12000});
            if(response&&response.ok()){
