name: Live Site QA

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  qa:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare browser test
        run: npm install --no-save puppeteer-core@24

      - name: Test desktop, tablet and mobile
        env:
          SITE: https://mmashharawi2021-cell.github.io/Library-/
        run: |
          cat > qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const site=process.env.SITE;
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};

          for(const width of [390,768,1366]){
            const page=await browser.newPage();
            await page.setViewport({width,height:900,deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(site,{waitUntil:'networkidle0'});
            await page.waitForSelector('.card');
            const stats=await page.evaluate(()=>({
              cards:document.querySelectorAll('#cards > .card').length,
              sw:document.documentElement.scrollWidth,
              cw:document.documentElement.clientWidth
            }));
            assert(stats.cards===81,`home cards ${stats.cards} at ${width}`);
            assert(stats.sw<=stats.cw+2,`horizontal overflow ${stats.sw}/${stats.cw} at ${width}`);
            assert(errors.length===0,`JS errors at ${width}: ${errors.join(' | ')}`);
            await page.close();
          }

          const page=await browser.newPage();
          await page.setViewport({width:390,height:900});
          await page.goto(site,{waitUntil:'networkidle0'});
          await page.type('#search','الخلفية الداكنة خلف النافذة');
          await new Promise(r=>setTimeout(r,150));
          let slugs=await page.$$eval('#cards > .card',els=>els.map(e=>e.getAttribute('href')));
          assert(slugs.some(x=>x?.includes('scrim')),`search did not find scrim: ${slugs}`);

          await page.click('[data-cat="macos"]');
          await page.waitForSelector('.card');
          let count=await page.$$eval('#cards > .card',els=>els.length);
          assert(count===32,`macOS filter count ${count}`);

          await page.goto(site+'element/scrim/',{waitUntil:'networkidle0'});
          await page.waitForSelector('.detail h1');
          let h1=await page.$eval('.detail h1',e=>e.textContent.trim());
          assert(h1.includes('التعتيم'),`direct element route failed: ${h1}`);

          await page.goto(site+'styles/',{waitUntil:'networkidle0'});
          await page.waitForSelector('.style-card');
          count=await page.$$eval('.style-card',els=>els.length);
          assert(count===14,`styles count ${count}`);

          await page.goto(site+'compare/',{waitUntil:'networkidle0'});
          await page.waitForSelector('.compare');
          count=await page.$$eval('.compare',els=>els.length);
          assert(count===18,`compare count ${count}`);

          await page.goto(site+'translate/',{waitUntil:'networkidle0'});
          await page.waitForSelector('.translation tbody tr');
          count=await page.$$eval('.translation tbody tr',els=>els.length);
          assert(count===63,`translation rows ${count}`);

          await browser.close();
          console.log('Live QA passed');
          JS
          node qa.mjs
