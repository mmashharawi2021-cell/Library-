name: Temporary Visual QA
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
permissions:
  contents: read
jobs:
  capture:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save puppeteer-core@24
      - run: |
          cat > capture.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.setViewport({width:393,height:900,deviceScaleFactor:2});
          await page.goto('https://mmashharawi2021-cell.github.io/Library-/?qa=12',{waitUntil:'networkidle0',timeout:60000});
          await page.screenshot({path:'v12.png',fullPage:true});
          console.log(await page.evaluate(()=>({
            dpr:devicePixelRatio,
            hero:document.querySelector('.hero')?.getBoundingClientRect(),
            search:document.querySelector('.hero-search')?.getBoundingClientRect(),
            toolbar:document.querySelector('.catalog-toolbar')?.getBoundingClientRect(),
            firstPreview:document.querySelector('.entry-preview')?.getBoundingClientRect(),
            secondRow:document.querySelectorAll('.entry-preview')[2]?.getBoundingClientRect(),
            firstBody:document.querySelector('.entry-body')?.getBoundingClientRect()
          })));
          await browser.close();
          JS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v12-visual
          path: v12.png
