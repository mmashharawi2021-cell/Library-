name: Visual QA Snapshot

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Puppeteer
        run: npm install --no-save puppeteer-core@24

      - name: Capture mobile homepage
        run: |
          cat > capture.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.setViewport({width:393,height:900,deviceScaleFactor:2});
          await page.goto('https://mmashharawi2021-cell.github.io/Library-/?visualqa=6',{waitUntil:'networkidle0',timeout:60000});
          await page.screenshot({path:'mobile-home-v6.png',fullPage:true});
          console.log(await page.evaluate(()=>({
            cards:document.querySelectorAll('.entry-card').length,
            cols:getComputedStyle(document.querySelector('.entries-grid')).gridTemplateColumns,
            title:document.querySelector('.hero h1')?.textContent,
            firstCard:document.querySelector('.entry-card h3')?.textContent
          })));
          await browser.close();
          JS
          node capture.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa-v6
          path: mobile-home-v6.png
